  /* ============================================================
     🎤 Enregistrer — capture principale, fonctionne SANS réseau.
     - MediaRecorder.start(timeslice) : un morceau toutes les REC_TIMESLICE_MS, écrit
       aussitôt dans IndexedDB (ArrayBuffer, jamais Blob — bug WebKit). Si l'app est tuée
       (batterie, appel, iOS), les morceaux déjà écrits sont récupérés au lancement suivant.
     - Niveau sonore en direct (AnalyserNode sur le même flux), durée + taille sauvegardée,
       alerte à l'arrêt si rien n'a été capté, écran maintenu allumé (Wake Lock),
       avertissement si l'utilisateur a quitté l'app pendant la capture.
     - Jamais en même temps que Dicter (conflit micro).
     ============================================================ */
  let rec = null;
  let recStarting = false; // micro en cours d'ouverture : un second appui est ignor\u00e9 (double appui = 2 enregistreurs, constat du 8 octobre)
  let viewClosed = false;  // \u00e9cran quitt\u00e9 pendant l'ouverture du micro : le d\u00e9marrage est abandonn\u00e9
  async function toggleRecording(){
    if(rec){ if(Date.now() - rec.startedAt >= REC_MIN_STOP_MS) stopRecording(); return; } // 2e appui d'un double appui : ignor\u00e9
    if(dict || recStarting) return;
    recStarting = true;
    const b = addRow.querySelector("#btnRec");
    b.disabled = true;
    try{ await startRecording(); }
    finally{ recStarting = false; b.disabled = !!dict; }
  }
  async function startRecording(){
    if(!confirmStorageSync()) return;
    const btn = addRow.querySelector("#btnRec");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ showError(t("micUnavailable")); return; }
    // AudioContext créé dans le geste utilisateur, avant tout await (exigence iOS).
    const Ctx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    try{ audioCtx = Ctx ? new Ctx() : null; }catch(e){ audioCtx = null; }
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(err){ if(audioCtx) audioCtx.close().catch(() => {}); showError(t("micDenied")); return; }
    const abandon = () => { stream.getTracks().forEach(tr => tr.stop()); if(audioCtx) audioCtx.close().catch(() => {}); };
    if(viewClosed || dict){ abandon(); return; }
    const mime = bestAudioMime();
    let mr;
    try{ mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: REC_BITRATE }, mime ? { mimeType: mime } : {})); }
    catch(e){ mr = new MediaRecorder(stream); }
    const recId = uid();
    const meta = { recId, visitUid: visit.uid, mime: mr.mimeType || mime || "audio/webm", startedAt: Date.now(), location: freshFix() };
    try{ await idbPutRaw("recordings", meta); }
    catch(err){
      stream.getTracks().forEach(tr => tr.stop());
      if(audioCtx) audioCtx.close().catch(() => {});
      showError(t("recStartFailed").replace("{err}", (err && (err.name || err.message)) || "?"));
      return;
    }
    if(viewClosed || dict){ abandon(); await idbDeleteRaw("recordings", recId).catch(() => {}); return; }
    if(!meta.location) tryGetPosition().then(loc => { if(loc && !meta.location){ meta.location = loc; idbPutRaw("recordings", meta).catch(() => {}); } });

    const now0 = Date.now();
    const r = rec = { mr, stream, recId, seq: 0, bytes: 0, savedChunks: 0, failedChunks: 0, startedAt: now0, audioCtx, peak: 0, writes: [], wakeLock: null, leftApp: false, stopping: false,
      ackAt: now0, lastSoundAt: now0, prompt: null, silenceAlerted: false, autoStopped: false, lastBeat: 0, releaseLock: null };
    activeRecIds.add(recId);
    // Verrou tenu tant que l'enregistrement vit dans CETTE instance : une autre instance (onglet,
    // fen\u00eatre) ne le "r\u00e9cup\u00e8re" pas pendant qu'il tourne. Lib\u00e9r\u00e9 automatiquement si l'app meurt.
    if(navigator.locks && navigator.locks.request){
      const held = new Promise(res => { r.releaseLock = res; });
      navigator.locks.request("rdc39-rec-" + recId, () => held).catch(() => {});
    }
    mr.ondataavailable = (e) => {
      if(!e.data || e.data.size === 0) return;
      const seq = r.seq++;
      const size = e.data.size;
      r.writes.push(e.data.arrayBuffer()
        .then(buf => idbPutRaw("audioChunks", { id: recId + ":" + String(seq).padStart(6, "0"), recId, seq, data: buf }))
        .then(() => { r.bytes += size; r.savedChunks++; return recHeartbeat(r, meta); })
        .catch((err) => onChunkWriteFailed(r, err)));
    };
    mr.onstop = () => finishRecording(r);
    mr.onerror = () => { try{ if(mr.state !== "inactive") mr.stop(); else finishRecording(r); }catch(e){ finishRecording(r); } };
    mr.start(REC_TIMESLICE_MS);

    // Niveau sonore
    if(audioCtx){
      try{
        const src = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser); // pas de connexion vers les haut-parleurs : aucune lecture
        if(audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        const buf = new Uint8Array(analyser.fftSize);
        r.levelTimer = setInterval(() => {
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for(let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
          const rms = Math.sqrt(sum / buf.length);
          if(rms > r.peak) r.peak = rms;
          if(rms >= REC_SILENCE_THRESHOLD){ r.lastSoundAt = Date.now(); if(r.prompt === "silence") hideRecPrompt(r); r.silenceAlerted = false; }
          const bar = document.getElementById("levelBar");
          // \u00e9chelle racine : une voix normale remplit visiblement la barre, le silence la laisse vide
          if(bar) bar.style.width = Math.min(100, Math.round(Math.sqrt(rms) * 160)) + "%";
        }, 100);
      }catch(e){ r.peak = -1; } // pas de mesure possible : on ne déclenchera pas l'alerte "silence"
    } else r.peak = -1;

    // Écran maintenu allumé
    requestWakeLock(r);

    btn.textContent = "⏹ " + t("recStop");
    btn.classList.add("recording");
    addRow.querySelector("#btnDictate").disabled = true;
    recStatus.innerHTML = `
      <div class="rec-live">
        <div class="rec-line"><span class="rec-dot">●</span><span class="rec-timer" id="recTimer">00:00</span></div>
        <div class="level"><div class="level-bar" id="levelBar"></div></div>
        <div class="rec-keep">${t("recKeepOpen")}</div>
        <div class="rec-alert" id="recAlert" hidden></div>
      </div>`;
    r.watch = setInterval(() => recWatchTick(r), 1000);
    recordTimerInterval = setInterval(() => {
      setTextIfChanged(document.getElementById("recTimer"), fmtDuration((Date.now() - r.startedAt) / 1000) + " · " + fmtBytes(r.bytes) + " " + t("recSavedBytes"));
    }, 250);
  }
  /* \u00c9criture d'un morceau impossible (stockage plein, erreur IndexedDB...) : alerte IMM\u00c9DIATE, les
     morceaux d\u00e9j\u00e0 \u00e9crits sont conserv\u00e9s, et l'utilisateur peut terminer proprement tout de suite. */
  function onChunkWriteFailed(r, err){
    r.failedChunks++;
    try{ console.error(errText("audioChunk"), err); }catch(e){}
    if(r.writeAlertShown || r.finished) return;
    r.writeAlertShown = true;
    const saved = fmtDuration(r.savedChunks * REC_TIMESLICE_MS / 1000);
    const msg = t("recWriteFailed").replace("{saved}", saved).replace("{err}", (err && (err.name || err.message)) || "?");
    setTimeout(() => { // hors du gestionnaire d'\u00e9v\u00e9nement de l'enregistreur
      if(confirm(errText(msg))) stopRecording();
      else r.writeAlertShown = false; // on continue : une nouvelle panne sera de nouveau signal\u00e9e
    }, 0);
  }
  /* \u00c9tat "vivant" pour les autres instances (repli quand navigator.locks manque) : au plus
     une \u00e9criture des m\u00e9tadonn\u00e9es toutes les 10 s. */
  function recHeartbeat(r, meta){
    if(r.finished || Date.now() - r.lastBeat < 10000) return;
    r.lastBeat = Date.now(); meta.aliveAt = r.lastBeat;
    return idbPutRaw("recordings", meta).catch(() => {});
  }
  function recWatchTick(r){
    if(r.finished || r.stopping) return;
    const tm = recTiming(), now = Date.now();
    if(now - r.ackAt >= tm.autostop){ r.autoStopped = true; hideRecPrompt(r); stopRecordingOf(r); return; }
    if(now - r.ackAt >= tm.remind){ if(r.prompt !== "remind") showRecPrompt(r, "remind"); }
    else if(r.peak >= 0 && now - r.lastSoundAt >= tm.silence && !r.silenceAlerted && !r.prompt){ r.silenceAlerted = true; showRecPrompt(r, "silence"); }
  }
  function showRecPrompt(r, kind){
    r.prompt = kind;
    const box = document.getElementById("recAlert");
    if(box){
      const tm = recTiming();
      const msg = kind === "remind"
        ? t("recRemind").replace("{min}", Math.round((Date.now() - r.startedAt) / 60000)).replace("{left}", Math.max(1, Math.round((r.ackAt + tm.autostop - Date.now()) / 60000)))
        : t("recSilence").replace("{min}", Math.round(tm.silence / 60000));
      box.innerHTML = `<p>${escapeHtml(msg)}</p><div class="row"><button class="btn primary" data-a="go">${t("recContinue")}</button><button class="btn danger" data-a="stop">${t("recStopNow")}</button></div>`;
      box.hidden = false;
      box.querySelector('[data-a="go"]').addEventListener("click", () => {
        if(kind === "remind") r.ackAt = Date.now(); else { r.lastSoundAt = Date.now(); r.silenceAlerted = false; } // silence persistant : nouvelle alerte 3 min plus tard
        hideRecPrompt(r);
      });
      box.querySelector('[data-a="stop"]').addEventListener("click", () => { hideRecPrompt(r); stopRecordingOf(r); });
    }
    try{ if(navigator.vibrate) navigator.vibrate([400, 200, 400]); }catch(e){}
  }
  function hideRecPrompt(r){
    r.prompt = null;
    const box = document.getElementById("recAlert");
    if(box){ box.hidden = true; box.innerHTML = ""; }
  }
  function stopRecording(){ stopRecordingOf(rec); }
  function stopRecordingOf(r){
    if(!r || r.stopping) return;
    r.stopping = true;
    try{ if(r.mr.state !== "inactive") r.mr.stop(); else finishRecording(r); }catch(e){ finishRecording(r); }
  }
  async function finishRecording(r){
    if(r.finished) return;
    r.finished = true;
    if(rec === r) rec = null;
    const durationSec = Math.round((Date.now() - r.startedAt) / 1000);
    clearInterval(recordTimerInterval);
    clearInterval(r.levelTimer);
    clearInterval(r.watch);
    r.stream.getTracks().forEach(tr => tr.stop());
    if(r.audioCtx) r.audioCtx.close().catch(() => {});
    if(r.wakeLock) r.wakeLock.release().catch(() => {});
    recStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnRec");
    btn.textContent = "\u{1F3A4} " + t("addAudio");
    btn.classList.remove("recording");
    updateDictateAvailability();
    await Promise.all(r.writes);
    let entry = null;
    try{ entry = await finalizeRecording(r.recId, durationSec, false); }
    catch(err){
      // Assemblage impossible (souvent : stockage plein) : les morceaux restent sur l'appareil et
      // seront r\u00e9cup\u00e9r\u00e9s au prochain lancement de l'app.
      activeRecIds.delete(r.recId);
      if(r.releaseLock) r.releaseLock();
      alertError(t("recFinalizeFailed").replace("{err}", (err && (err.name || err.message)) || "?"));
      return;
    }
    if(entry && !entry.location) attachPositionLater(entry.id, entry.timestamp);
    activeRecIds.delete(r.recId);
    if(r.releaseLock) r.releaseLock();
    if(!main.isConnected) return;
    refreshEntries(); refreshWeight();
    if(!entry){ showError(t("recEmpty")); return; }
    if(r.autoStopped) showToast(t("recAutoStopped").replace("{d}", fmtDuration(durationSec)), 8000);
    else showToast(t("recSaved") + " (" + fmtDuration(durationSec) + ")");
    if(r.failedChunks) alertError(t("recPartial").replace("{n}", r.failedChunks));
    else if(r.peak >= 0 && r.peak < REC_SILENCE_THRESHOLD) alertError(t("recSilentWarning"));
    else if(r.leftApp) alertError(t("recBackgroundWarn"));
  }
  function requestWakeLock(r){
    if(!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(l => { r.wakeLock = l; }).catch(() => {});
  }
  function onVisibility(){
    const r = rec;
    if(!r) return;
    if(document.visibilityState === "hidden") r.leftApp = true;
    else {
      requestWakeLock(r);
      // iOS peut avoir coupé le micro en arrière-plan : si l'enregistreur s'est arrêté seul, on sauvegarde.
      if(r.mr.state === "inactive") finishRecording(r);
      else showToast(t("recBackgroundToast"));
    }
  }
  function onBeforeUnload(e){ if(rec || dict){ e.preventDefault(); e.returnValue = ""; } }
  document.addEventListener("visibilitychange", onVisibility);
  window.addEventListener("beforeunload", onBeforeUnload);

  /* ============================================================
     🗣️ Dicter — secondaire, exige le réseau (bloqué hors connexion).
     Correctif des doublons/troncatures observés en mode continu : une session de
     reconnaissance PAR ÉNONCÉ (continuous = false), relancée automatiquement tant que
     l'utilisateur n'a pas touché Arrêter ; un seul résultat final par session, ajouté
     (jamais écrasé) avec anti-doublon ; brouillon sauvegardé au fil de l'eau ; texte
     marqué source:"dictee" (non relu). Affichage en direct : validé en noir, provisoire en gris.
     ============================================================ */
  let dict = null;
  const DICT_MAX_MS = 10 * 60 * 1000;
  function speechCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }
  function updateDictateAvailability(){
    const btn = addRow.querySelector("#btnDictate");
    const offHint = main.querySelector("#dictOffline");
    if(!btn) return;
    const offline = !navigator.onLine;
    btn.disabled = !!rec || (!dict && (offline || !speechCtor()));
    if(offHint){
      offHint.hidden = !(offline || !speechCtor()) || !!dict;
      offHint.textContent = speechCtor() ? t("dictateOfflineHint") : t("transcribeUnsupported");
    }
  }
  function onNetChange(){
    updateDictateAvailability();
    if(dict && !navigator.onLine){ dict.netLost = true; dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){} }
  }
  window.addEventListener("online", onNetChange);
  window.addEventListener("offline", onNetChange);

  function normalizeSpeech(s){ return (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); }
  function commitDictation(d, text){
    text = (text || "").trim();
    const n = normalizeSpeech(text);
    if(!n) return;
    const c = normalizeSpeech(d.committed);
    if(c === n || c.endsWith(" " + n)) return; // anti-doublon : déjà validé
    d.committed = d.committed ? d.committed + " " + text : text;
    if(!d.entry){
      d.entry = { id: uid(), visitUid: visit.uid, kind: "texte", source: "dictee", text: d.committed, label: "", location: d.location || null, timestamp: d.startedAt };
      d.needsLatePosition = !d.entry.location;
    } else {
      d.entry.text = d.committed;
      if(!d.entry.location && d.location) d.entry.location = d.location;
    }
    const snapshot = d.entry;
    d.saving = d.saving.then(() => idbPut("entries", snapshot)).catch(() => {});
    // Brouillon cr\u00e9\u00e9 sans position : on la lui rattachera d\u00e8s qu'elle arrive (apr\u00e8s sa 1re sauvegarde).
    if(d.needsLatePosition){
      d.needsLatePosition = false;
      const id = snapshot.id;
      const ts = snapshot.timestamp;
      d.saving = d.saving.then(() => attachPositionLater(id, ts));
    }
  }
  function renderDictation(d){
    const f = document.getElementById("dictFinal");
    const i = document.getElementById("dictInterim");
    setTextIfChanged(f, d.committed);
    setTextIfChanged(i, d.interim ? (d.committed ? " " : "") + d.interim : "");
    // Hauteur fixe : on reste cal\u00e9 sur la fin du texte (d\u00e9filement interne, la page ne bouge pas).
    const box = f && f.parentNode;
    if(box && box.scrollHeight > box.clientHeight) box.scrollTop = box.scrollHeight;
  }

  function toggleDictation(){
    if(dict){ dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){ finishDictation(dict); } return; }
    if(rec) return;
    if(!speechCtor()){ showError(t("transcribeUnsupported")); return; }
    if(!navigator.onLine){ showError(t("dictateOfflineBlocked")); return; }
    const d = dict = { committed: "", interim: "", stopRequested: false, entry: null, errorShown: false, rec: null,
      startedAt: Date.now(), location: null, saving: Promise.resolve(), errCount: 0 };
    // Position : mesure r\u00e9cente si elle existe ; sinon elle est demand\u00e9e d\u00e8s maintenant et, si elle
    // arrive avant le premier texte, le brouillon est cr\u00e9\u00e9 AVEC elle ; si elle arrive apr\u00e8s, elle est
    // rattach\u00e9e au brouillon (attachPositionLater), et idbPut la conserve \u00e0 chaque sauvegarde suivante.
    d.location = freshFix();
    if(!d.location) getPositionResult().then(r => { if(r.loc && !d.location) d.location = r.loc; });
    const btn = addRow.querySelector("#btnDictate");
    btn.textContent = t("dictateStop");
    addRow.querySelector("#btnRec").disabled = true;
    updateDictateAvailability();
    recStatus.innerHTML = `
      <div class="dict-live">
        <div class="rec-line"><span class="rec-dot">●</span><span class="rec-timer" id="recTimer">00:00</span></div>
        <div class="rec-help">${t("dictateListening")}</div>
        <div class="dict-text"><span class="final" id="dictFinal"></span><span class="interim" id="dictInterim"></span></div>
      </div>`;
    recordTimerInterval = setInterval(() => {
      setTextIfChanged(document.getElementById("recTimer"), fmtDuration((Date.now() - d.startedAt) / 1000));
      if(Date.now() - d.startedAt > DICT_MAX_MS){ d.stopRequested = true; try{ d.rec && d.rec.stop(); }catch(e){} }
    }, 250);
    startDictationSession(d);
  }
  function startDictationSession(d){
    const r = new (speechCtor())();
    d.rec = r;
    r.lang = speechRecogLangTag();
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;
    let sessionFinal = "", sessionInterim = "";
    r.onresult = (e) => {
      let fin = "", inter = "";
      for(let i = 0; i < e.results.length; i++){
        const tr = e.results[i][0].transcript;
        if(e.results[i].isFinal) fin = tr; // un seul final par session : le dernier fait foi
        else inter += tr;
      }
      if(fin) sessionFinal = fin;
      sessionInterim = inter;
      d.interim = (sessionFinal ? sessionFinal + " " : "") + inter;
      renderDictation(d);
    };
    r.onerror = (e) => {
      if(e.error === "aborted" && d.stopRequested) return;
      if(e.error === "no-speech" || e.error === "aborted") return; // silence : la session suivante prend le relais
      if(e.error === "network"){
        // Deux cas distincts : le navigateur est hors ligne (r\u00e9seau perdu), ou il est en ligne mais
        // le service de reconnaissance (serveurs du navigateur) n'est pas joignable depuis ce r\u00e9seau.
        if(navigator.onLine) d.serviceUnreachable = e.error;
        else d.netLost = true;
        d.stopRequested = true;
      }
      else if(e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){ d.stopRequested = true; }
      else if(++d.errCount > 3) d.stopRequested = true;
      if(d.stopRequested && !d.errorShown && !d.netLost && !d.serviceUnreachable){
        d.errorShown = true;
        showError(t("dictationErrorPrefix") + " : " + dictationErrorLabel(e.error));
      }
    };
    r.onend = () => {
      // Si le moteur s'arrête sans résultat final, on garde le provisoire plutôt que de le perdre.
      commitDictation(d, sessionFinal || sessionInterim);
      d.interim = "";
      renderDictation(d);
      // Navigateur pass\u00e9 hors ligne sans que l'\u00e9v\u00e9nement "offline" ait \u00e9t\u00e9 re\u00e7u : m\u00eame message que la perte de r\u00e9seau.
      if(!d.stopRequested && !navigator.onLine){ d.netLost = true; d.stopRequested = true; }
      if(!d.stopRequested && dict === d && navigator.onLine){
        setTimeout(() => {
          if(d.stopRequested || dict !== d){ finishDictation(d); return; }
          try{ startDictationSession(d); }catch(err){ finishDictation(d); }
        }, 120);
      } else {
        finishDictation(d);
      }
    };
    try{ r.start(); }
    catch(err){ d.stopRequested = true; finishDictation(d); }
  }
  async function finishDictation(d){
    if(d.finished) return;
    d.finished = true;
    if(dict === d) dict = null;
    clearInterval(recordTimerInterval);
    recStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnDictate");
    btn.textContent = t("addDictate");
    addRow.querySelector("#btnRec").disabled = false;
    updateDictateAvailability();
    await d.saving;
    if(!main.isConnected) return;
    refreshEntries(); refreshWeight();
    if(d.netLost) showError(d.entry ? t("dictateNetLost") : t("dictateNetLostEmpty"));
    else if(d.serviceUnreachable) showError(t("dictateServiceUnreachable") + " (" + d.serviceUnreachable + ")");
    else if(d.entry) showToast(t("dictateSaved"));
    else if(!d.errorShown) showToast(t("dictateEmpty"));
  }

  function dictationErrorLabel(code){
    if(code === "not-allowed" || code === "service-not-allowed") return t("dictationErrorNoAllow");
    if(code === "network") return t("dictationErrorNetwork");
    if(code === "no-speech") return t("dictationErrorNoSpeech");
    return t("dictationErrorOther") + " (" + code + ")";
  }

  // Quitter l'écran arrête proprement une capture en cours (elle est sauvegardée) et retire les écouteurs.
  currentViewCleanup = () => {
    viewClosed = true;
    media.clear();
    stopGeoWatch();
    geoListeners.delete(renderGeoLine);
    if(pointFix) finishPoint(pointFix, false);
    if(rec) stopRecording();
    if(dict){ dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){} }
    document.removeEventListener("visibilitychange", onVisibility);
    window.removeEventListener("beforeunload", onBeforeUnload);
    window.removeEventListener("online", onNetChange);
    window.removeEventListener("offline", onNetChange);
  };
  updateDictateAvailability();

  async function exportVisit(v){
    const entries = await idbGetByIndex("entries", "visitUid", v.uid);
    entries.sort((a,b) => a.timestamp - b.timestamp);
    const totalBytes = entries.reduce((s,e) => s + getEntrySize(e), 0);
    if(!confirm(t("exportVisit") + " (~" + fmtBytes(totalBytes) + " " + t("exportWeightEstimate") + ")")) return;
    const reportText = buildReportText(v, entries, "chrono");
    downloadBlob(new Blob([reportText], { type: "text/plain;charset=utf-8" }), safeFileName(v.tag || v.uid) + "_rapport.txt");
    const manifest = {
      uid: v.uid, tag: v.tag, date: v.date,
      entries: entries.map((e,i) => ({
        type: e.kind, horodatage: new Date(e.timestamp).toISOString(), repere: e.label || null,
        position: e.location || null, texte: e.text || null,
        fichier: getEntrySize(e) > 0 ? (e.kind === "fichier" ? (e.fileName || ("fichier_" + (i+1))) : (e.kind === "audio" ? "audio_" : "photo_") + (i+1) + extFor(e)) : null
      }))
    };
    downloadBlob(new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json" }), safeFileName(v.tag || v.uid) + "_donnees.json");
    entries.forEach((e, i) => {
      let entryBlob = getEntryBlob(e);
      if(!entryBlob) return;
      if(e.kind === "photo" && e.data && e.location){
        entryBlob = new Blob([photoBufferForExport(e.data, e, getEntryMime(e))], { type: getEntryMime(e) || "image/jpeg" });
      }
      const name = e.kind === "fichier" ? (e.fileName || ("fichier_" + (i+1))) : safeFileName(v.tag || v.uid) + "_" + (e.kind === "audio" ? "audio_" : "photo_") + (i+1) + extFor(e);
      downloadBlob(entryBlob, name);
    });
    showToast(t("exportLaunched"));
  }

  /* Export "digest" : un seul fichier JSON autonome, pens\u00e9 pour \u00eatre lu par un programme
     plut\u00f4t qu'un humain (cf. note de connexion Calepin -> module pompage). Photos ET pi\u00e8ces
     jointes (PDF/DOCX/XLSX) encod\u00e9es en base64 et int\u00e9gr\u00e9es (pour les pi\u00e8ces jointes, aucun
     substitut texte n'existe, contrairement \u00e0 l'audio — le fichier brut est donc la seule
     trace possible de cette information) ; audio volontairement EXCLU (transcription seule) ;
     aucune synth\u00e8se IA n'est g\u00e9n\u00e9r\u00e9e \u00e0 la demande de l'export. */
  async function exportDigest(v){
    const entriesForWeight = await idbGetByIndex("entries", "visitUid", v.uid);
    const nonCompressible = entriesForWeight.filter(e => e.kind === "fichier").length;
    const estBytes = entriesForWeight.reduce((s,e) => s + getEntrySize(e) * 1.33, 0);
    let confirmMsg = t("digestConfirm") + " (~" + fmtBytes(estBytes) + " " + t("exportWeightEstimate") + ")";
    if(nonCompressible > 0) confirmMsg += " \u2014 " + t("exportWeightWarn");
    if(!confirm(confirmMsg)) return;
    const digest = await buildDigest(v);
    downloadBlob(new Blob([JSON.stringify(digest)], { type: "application/json" }), safeFileName(v.tag || v.uid) + "_digest.json");
    showToast(t("digestExported"));
  }
  function extFor(e){
    if(e.kind === "photo") return ".jpg";
    const type = getEntryMime(e) || "";
    if(type.includes("mp4")) return ".m4a";
    if(type.includes("ogg")) return ".ogg";
    return ".webm";
  }
  function safeFileName(s){
    return (s || "visite").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0, 40);
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function deleteVisit(v){
    if(!(await confirmTrashVisits([v.uid]))) return;
    v.trashedAt = Date.now();
    await idbPut("visits", v);
    showToast(t("trashedVisit"));
    window.location.hash = "#home";
  }

  refreshWeight();
  refreshEntries();
}

/* ============================================================
   Assemblage d\u00e9terministe du rapport (texte, pas de mise en page)
   ============================================================ */
function buildReportText(visit, entries, groupBy){
  let out = (visit.tag || "\u2014") + "\n" + fmtDate(visit.date) + "\n" + "=".repeat(40) + "\n\n";
  const lineFor = (e) => {
    const time = fmtTime(e.timestamp);
    const gps = e.location ? " [" + e.location.lat.toFixed(5) + ", " + e.location.lng.toFixed(5) + "]" : "";
    if(e.kind === "photo") return "- " + time + gps + " \u2014 [photo]" + (e.text ? " " + e.text : "");
    if(e.kind === "point") return "- " + time + " \u2014 [point GPS " + fmtPointDetails(e.location) + "]" + (e.label ? " " + e.label : "") + (e.text && e.text.trim() ? " \u2014 " + e.text.trim() : "");
    if(e.kind === "audio") return "- " + time + gps + " \u2014 [audio " + fmtDuration(e.duration) + "]" + (e.text && e.text.trim() ? " " + e.text.trim() : "");
    if(e.kind === "fichier") return "- " + time + gps + " \u2014 [fichier " + (e.fileName || "") + "]";
    const content = e.text && e.text.trim() ? e.text.trim() : "(" + t("transcriptPh") + ")";
    return "- " + time + gps + " \u2014 " + content;
  };
  if(groupBy === "landmark"){
    const groups = {};
    for(const e of entries){
      const key = e.label && e.label.trim() ? e.label.trim() : t("noLandmark");
      (groups[key] = groups[key] || []).push(e);
    }
    for(const key of Object.keys(groups)){
      out += key + "\n" + "-".repeat(key.length) + "\n";
      for(const e of groups[key]) out += lineFor(e) + "\n";
      out += "\n";
    }
  } else {
    for(const e of entries) out += lineFor(e) + "\n";
  }
  return out;
}

   Vue : rapport / consolidation (consultation en app)
   ============================================================ */
async function renderReport(uidVal){
  const visit = await idbGet("visits", uidVal);
  if(!visit){ window.location.hash = "#home"; return; }
  let groupBy = "chrono";

  main.innerHTML = "";
  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML = `<h2>${escapeHtml(visit.tag) || "\u2014"}</h2><div class="meta">${fmtDate(visit.date)}</div>`;
  main.appendChild(head);

  const toggle = document.createElement("div");
  toggle.className = "group-toggle";
  toggle.innerHTML = `<button data-g="chrono" class="active">${t("groupChrono")}</button><button data-g="landmark">${t("groupLandmark")}</button>`;
  main.appendChild(toggle);

  const body = document.createElement("div");
  main.appendChild(body);

  const exportBtn = document.createElement("button");
  exportBtn.className = "btn"; exportBtn.style.width = "100%"; exportBtn.style.marginTop = "18px";
  exportBtn.textContent = "\u{1F4E4} " + t("exportReport");
  main.appendChild(exportBtn);

  const media = createMediaCache();
  currentViewCleanup = () => media.clear();
  async function render(){
    const entries = (await idbGetByIndex("entries", "visitUid", visit.uid)).sort((a,b) => a.timestamp - b.timestamp);
    media.begin();
    body.innerHTML = "";
    if(entries.length === 0){
      body.innerHTML = `<p class="capture-hint">${t("noEntries")}</p>`;
      media.end();
      return;
    }
    const renderEntry = (e) => {
      const div = document.createElement("div");
      div.className = "report-entry";
      const gps = e.location && e.kind !== "point" ? " \u00b7 \u{1F4CD} " + e.location.lat.toFixed(5) + ", " + e.location.lng.toFixed(5) : "";
      let mediaEl = null;
      let inner = `<span class="rmeta">${fmtTime(e.timestamp)}${gps}</span>`;
      if(e.kind === "photo"){
        mediaEl = media.get(e, buildImgEl);
      } else if(e.kind === "point"){
        inner += `<div>\u{1F4CD} ${escapeHtml((e.label ? e.label + " \u2014 " : "") + fmtPointDetails(e.location))}</div>` +
          (e.text && e.text.trim() ? `<div>${escapeHtml(e.text.trim())}</div>` : "");
      } else if(e.kind === "audio"){
        mediaEl = media.get(e, buildAudioEl);
        inner += (e.text && e.text.trim() ? `<div>${escapeHtml(e.text.trim())}</div>` : "");
      } else {
        inner += escapeHtml(e.text && e.text.trim() ? e.text.trim() : "(" + t("transcriptPh") + ")");
      }
      div.innerHTML = inner;
      if(mediaEl) div.insertBefore(mediaEl, div.children[1] || null);
      return div;
    };
    if(groupBy === "landmark"){
      const groups = {};
      for(const e of entries){
        const key = e.label && e.label.trim() ? e.label.trim() : t("noLandmark");
        (groups[key] = groups[key] || []).push(e);
      }
      for(const key of Object.keys(groups)){
        const g = document.createElement("div");
        g.className = "report-group";
        const h = document.createElement("h3"); h.textContent = key; g.appendChild(h);
        for(const e of groups[key]) g.appendChild(renderEntry(e));
        body.appendChild(g);
      }
    } else {
      const g = document.createElement("div");
      g.className = "report-group";
      for(const e of entries) g.appendChild(renderEntry(e));
      body.appendChild(g);
    }
    media.end();
  }

  toggle.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      groupBy = btn.dataset.g;
      toggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  exportBtn.addEventListener("click", async () => {
    const entries = (await idbGetByIndex("entries", "visitUid", visit.uid)).sort((a,b) => a.timestamp - b.timestamp);
    const txt = buildReportText(visit, entries, groupBy);
    const url = URL.createObjectURL(new Blob([txt], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = (visit.tag || "rapport").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0,40) + "_rapport.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast(t("reportExported"));
  });

  render();
}

async function renderFolders(){
  main.innerHTML = "";

  const introHint = document.createElement("p");
  introHint.className = "capture-hint";
  introHint.style.marginTop = "0";
  introHint.textContent = t("hintFolders");
  main.appendChild(introHint);

  const shortcuts = document.createElement("div");
  shortcuts.className = "folder-top";
  shortcuts.innerHTML = `
    <div class="simple-list-row" id="rowAll"><span>${t("allVisits")}</span><span>\u203a</span></div>
    <div class="simple-list-row" id="rowUnfiled"><span>${t("unfiled")}</span><span>\u203a</span></div>
    <div class="simple-list-row" id="rowTrash"><span>\u{1F5D1} ${t("trash")}</span><span>\u203a</span></div>
  `;
  main.appendChild(shortcuts);
  shortcuts.querySelector("#rowAll").addEventListener("click", () => { filterState.folder = null; window.location.hash = "#home"; });
  shortcuts.querySelector("#rowUnfiled").addEventListener("click", () => { filterState.folder = "unfiled"; window.location.hash = "#home"; });
  shortcuts.querySelector("#rowTrash").addEventListener("click", () => { window.location.hash = "#trash"; });

  const folderSection = document.createElement("div");
  folderSection.className = "section";
  folderSection.innerHTML = `<h3>${t("folders")}</h3><div id="folderTree"></div><button class="btn" id="btnNewTop">${t("newTopFolder")}</button>`;
  main.appendChild(folderSection);

  async function renderTree(){
    const tree = folderSection.querySelector("#folderTree");
    tree.innerHTML = "";
    const allVisitsForCount = (await idbGetAll("visits")).filter(v => !v.trashedAt);
    function countFor(folderId){ return allVisitsForCount.filter(v => v.folderId === folderId).length; }
    const tops = await getTopFolders();
    for(const top of tops){
      const row = document.createElement("div");
      row.className = "folder-top-row";
      row.style.cursor = "pointer";
      row.innerHTML = `
        <span class="name">${escapeHtml(top.name)}<span class="count">(${countFor(top.id)})</span></span>
        <div class="folder-actions">
          <button data-act="rename">\u270f\ufe0f</button>
          <button data-act="delete">\u{1F5D1}</button>
        </div>
      `;
      row.addEventListener("click", () => { filterState.folder = top.id; window.location.hash = "#home"; });
      row.querySelector('[data-act="rename"]').addEventListener("click", async (e) => {
        e.stopPropagation();
        const name = prompt(t("renameFolderPrompt"), top.name);
        if(name && name.trim()){ top.name = name.trim(); await idbPut("folders", top); renderTree(); }
      });
      row.querySelector('[data-act="delete"]').addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm(t("confirmDeleteFolder"))) return;
        const subs = await getSubFolders(top.id);
        const allVisits = await idbGetAll("visits");
        for(const sub of subs){
          for(const v of allVisits.filter(v2 => v2.folderId === sub.id)){ v.folderId = null; await idbPut("visits", v); }
          await idbDelete("folders", sub.id);
        }
        for(const v of allVisits.filter(v2 => v2.folderId === top.id)){ v.folderId = null; await idbPut("visits", v); }
        await idbDelete("folders", top.id);
        renderTree();
      });
      tree.appendChild(row);

      const subList = document.createElement("div");
      subList.className = "folder-sub-list";
      const subs = await getSubFolders(top.id);
      for(const sub of subs){
        const subRow = document.createElement("div");
        subRow.className = "folder-sub-row";
        subRow.style.cursor = "pointer";
        subRow.innerHTML = `
          <span>${escapeHtml(sub.name)}<span class="count">(${countFor(sub.id)})</span></span>
          <div class="folder-actions">
            <button data-act="move">\u21c6</button>
            <button data-act="rename">\u270f\ufe0f</button>
            <button data-act="delete">\u{1F5D1}</button>
          </div>
        `;
        subRow.addEventListener("click", () => { filterState.folder = sub.id; window.location.hash = "#home"; });
        subRow.querySelector('[data-act="rename"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          const name = prompt(t("renameFolderPrompt"), sub.name);
          if(name && name.trim()){ sub.name = name.trim(); await idbPut("folders", sub); renderTree(); }
        });
        subRow.querySelector('[data-act="delete"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          if(!confirm(t("confirmDeleteFolder"))) return;
          const allVisits = await idbGetAll("visits");
          for(const v of allVisits.filter(v2 => v2.folderId === sub.id)){ v.folderId = null; await idbPut("visits", v); }
          await idbDelete("folders", sub.id);
          renderTree();
        });
        subRow.querySelector('[data-act="move"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          const others = (await getTopFolders()).filter(f => f.id !== top.id);
          if(others.length === 0){ showToast(t("moveFolderPrompt")); return; }
          const label = others.map((f,i) => (i+1) + ". " + f.name).join("\n");
          const choice = prompt(t("moveFolderPrompt") + "\n" + label);
          const idx = Number(choice) - 1;
          if(others[idx]){ sub.parentId = others[idx].id; await idbPut("folders", sub); renderTree(); }
        });
        subList.appendChild(subRow);
      }
      tree.appendChild(subList);

      const addSub = document.createElement("div");
      addSub.className = "folder-add-sub";
      addSub.innerHTML = `<button>${t("newSubFolder")}</button>`;
      addSub.querySelector("button").addEventListener("click", async () => {
        const name = prompt(t("newSubFolderPrompt"));
        if(name && name.trim()){
          await idbPut("folders", { id: uid(), name: name.trim(), parentId: top.id });
          renderTree();
        }
      });
      tree.appendChild(addSub);
    }
  }
  renderTree();

  folderSection.querySelector("#btnNewTop").addEventListener("click", async () => {
    const name = prompt(t("newTopFolderPrompt"));
    if(name && name.trim()){
      await idbPut("folders", { id: uid(), name: name.trim(), parentId: null });
      renderTree();
    }
  });

  const tagSection = document.createElement("div");
  tagSection.className = "section";
  tagSection.innerHTML = `<h3>${t("tagsSection")}</h3><div id="tagList"></div>`;
  main.appendChild(tagSection);

  async function renderTagList(){
    const list = tagSection.querySelector("#tagList");
    const tags = await allTagsWithCounts();
    if(tags.length === 0){ list.innerHTML = `<p class="capture-hint">${t("noTags")}</p>`; return; }
    list.innerHTML = "";
    for(const { tag, count } of tags){
      const row = document.createElement("div");
      row.className = "simple-list-row";
      row.innerHTML = `
        <span>${escapeHtml(tag)} <span class="storage-line" style="display:inline;">(${count})</span></span>
        <div class="folder-actions">
          <button data-act="rename">\u270f\ufe0f</button>
          <button data-act="delete">\u{1F5D1}</button>
        </div>
      `;
      row.querySelector('[data-act="rename"]').addEventListener("click", async () => {
        const newName = prompt(t("renameTagPrompt"), tag);
        if(!newName || !newName.trim() || newName.trim() === tag) return;
        const visits = await idbGetAll("visits");
        for(const v of visits){
          if((v.tags || []).includes(tag)){
            v.tags = Array.from(new Set(v.tags.map(tg => tg === tag ? newName.trim() : tg)));
            await idbPut("visits", v);
          }
        }
        renderTagList();
      });
      row.querySelector('[data-act="delete"]').addEventListener("click", async () => {
        if(!confirm(t("confirmDeleteTag"))) return;
        const visits = await idbGetAll("visits");
        for(const v of visits){
          if((v.tags || []).includes(tag)){
            v.tags = v.tags.filter(tg => tg !== tag);
            await idbPut("visits", v);
          }
        }
        renderTagList();
      });
      list.appendChild(row);
    }
  }
  renderTagList();
}

async function renderTrash(){
  main.innerHTML = "";
  const emptyBtn = document.createElement("button");
  emptyBtn.className = "btn danger"; emptyBtn.style.width = "100%"; emptyBtn.style.marginBottom = "16px";
  emptyBtn.textContent = "\u{1F5D1} " + t("emptyTrash");
  main.appendChild(emptyBtn);

  const listEl = document.createElement("div");
  main.appendChild(listEl);

  async function refresh(){
    const visits = (await idbGetAll("visits")).filter(v => v.trashedAt).sort((a,b) => b.trashedAt - a.trashedAt);
    if(visits.length === 0){
      listEl.innerHTML = `<p class="capture-hint">${t("emptyTrashState")}</p>`;
      emptyBtn.hidden = true;
      return;
    }
    emptyBtn.hidden = false;
    listEl.innerHTML = "";
    for(const v of visits){
      const row = document.createElement("div");
      row.className = "visit-card";
      row.style.cursor = "default";
      row.innerHTML = `
        <div class="glyph">${VISIT_GLYPH}</div>
        <div class="info">
          <div class="tag">${escapeHtml(v.tag) || "\u2014"}</div>
          <div class="meta">${fmtDate(v.date)}</div>
        </div>
        <div class="folder-actions">
          <button data-act="restore">${t("restoreVisit")}</button>
          <button data-act="forever">\u{1F5D1}</button>
        </div>
      `;
      row.querySelector('[data-act="restore"]').addEventListener("click", async () => {
        v.trashedAt = null;
        await idbPut("visits", v);
        showToast(t("restoredVisit"));
        refresh();
      });
      row.querySelector('[data-act="forever"]').addEventListener("click", async () => {
        if(!(await confirmDeleteForever([v.uid]))) return;
        const entries = await idbGetByIndex("entries", "visitUid", v.uid);
        for(const e of entries) await idbDelete("entries", e.id);
        await idbDelete("visits", v.uid);
        refresh();
      });
      listEl.appendChild(row);
    }
  }
  emptyBtn.addEventListener("click", async () => {
    const visits = (await idbGetAll("visits")).filter(v => v.trashedAt);
    if(!visits.length || !(await confirmDeleteForever(visits.map(v => v.uid)))) return;
    for(const v of visits){
      const entries = await idbGetByIndex("entries", "visitUid", v.uid);
      for(const e of entries) await idbDelete("entries", e.id);
      await idbDelete("visits", v.uid);
    }
    refresh();
  });
  refresh();
}

  /* Synchronisation : \u00e9tat seulement (l'envoi est automatique d\u00e8s qu'une connexion existe),

    else showToast(t("syncDone"));

  backupGroup.className = "settings-group";
  const lastBackup = Number(localStorage.getItem("rdc39_last_backup") || "0");
  backupGroup.innerHTML = `
    <h3>${t("backupTitle")}</h3>
    <p class="capture-hint" style="margin-top:0;">${escapeHtml(t("backupHint"))}</p>
    <div class="storage-line" id="backupLastLine">${t("backupLast")} : ${lastBackup ? fmtDateTime(new Date(lastBackup).toISOString()) : t("backupNever")}</div>
    <button class="btn primary" id="btnBackupAll" style="width:100%; margin-top:10px;">${t("backupAll")}</button>`;
  main.appendChild(backupGroup);
  backupGroup.querySelector("#btnBackupAll").addEventListener("click", async () => {
    const all = await idbGetAll("visits");
    if(!all.length){ showError(t("backupNone")); return; }
    await exportSelectedVisits(all.map(v => v.uid), () => {
      const last = Number(localStorage.getItem("rdc39_last_backup") || "0");
      backupGroup.querySelector("#backupLastLine").textContent = t("backupLast") + " : " + (last ? fmtDateTime(new Date(last).toISOString()) : t("backupNever"));

  const storageGroup = document.createElement("div");

  storageGroup.innerHTML = `<h3>${t("settingsStorage")}</h3><div class="storage-line" id="storageLine">\u2026</div><div class="storage-line" id="versionLine" style="margin-top:6px;">RDC39-Calepin v${APP_VERSION}</div>`;
  main.appendChild(storageGroup);
  if(navigator.storage && navigator.storage.estimate){
    try{
      const est = await navigator.storage.estimate();
      storageGroup.querySelector("#storageLine").textContent = fmtBytes(est.usage || 0) + " " + t("storageUsed") +
        (est.quota ? " \u00b7 " + fmtBytes(Math.max(0, est.quota - (est.usage || 0))) + " " + t("storageFreeLabel") : "") +
        " \u00b7 " + t("storagePersistLabel") + " : " + (storagePersisted === true ? t("yes") : storagePersisted === false ? t("no") : "?");
    }catch(e){
      storageGroup.querySelector("#storageLine").textContent = t("storageUnknown");
    }
  } else {
    storageGroup.querySelector("#storageLine").textContent = t("storageUnknown");
  }

  const feedbackGroup = document.createElement("div");
  feedbackGroup.className = "settings-group";
  feedbackGroup.innerHTML = `<button class="btn" id="btnFeedback" style="width:100%;">${t("feedbackSend")}</button>`;
  main.appendChild(feedbackGroup);
  feedbackGroup.querySelector("#btnFeedback").addEventListener("click", sendFeedback);
}

/* ============================================================
   Retour bêta-test : même logique que le digest (jamais d'envoi
   automatique, geste volontaire) — utilise le partage natif du
   téléphone plutôt qu'un service d'envoi centralisé.
   ============================================================ */
async function sendFeedback(){
  const msg = prompt(t("feedbackPrompt"));
  if(!msg || !msg.trim()) return;

  const visits = await idbGetAll("visits");
  let storageInfo = "n/a";
  if(navigator.storage && navigator.storage.estimate){
    try{ const est = await navigator.storage.estimate(); storageInfo = fmtBytes(est.usage || 0); }catch(e){}
  }
  const payload = {
    message: msg.trim(),
    horodatage: new Date().toISOString(),
    langue: currentLang(),
    nombreVisites: visits.length,
    stockageUtilise: storageInfo,
    versionApp: APP_VERSION,
    navigateur: (navigator.userAgent || "").slice(0, 200)
  };
  const readableText = payload.message + "\n\n---\n" + payload.horodatage + " \u00b7 " +
    payload.nombreVisites + " visites \u00b7 " + payload.stockageUtilise + "\nRDC39-Calepin v" + payload.versionApp + "\n" + payload.navigateur;
  const jsonBlob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const fileName = "rdc39_retour_" + Date.now() + ".json";

  if(navigator.share){
    try{
      const file = new File([jsonBlob], fileName, { type: "application/json" });
      const shareData = (navigator.canShare && navigator.canShare({ files: [file] }))
        ? { title: t("feedbackShareTitle"), text: readableText, files: [file] }
        : { title: t("feedbackShareTitle"), text: readableText };
      await navigator.share(shareData);
      showToast(t("feedbackSent"));
      return;
    }catch(err){
      // annul\u00e9 par l'utilisateur ou API indisponible pour ce contenu \u2014 on retombe sur le t\u00e9l\u00e9chargement
    }
  }
  const url = URL.createObjectURL(jsonBlob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast(t("feedbackNoShare"));
}

/* ============================================================
   Service worker + d\u00e9marrage
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

// Rien ne s'affiche avant le passage de la porte d'acc\u00e8s (code valid\u00e9 ou d\u00e9lai de gr\u00e2ce).
startAccessGate();
})();
</script>
