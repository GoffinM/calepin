/* Revérification en arrière-plan (app ouverte) : à l'ouverture, au retour du réseau et au
   retour au premier plan (au plus une fois par heure dans ce dernier cas). */
let lastBackgroundCheck = 0;
async function revalidateInBackground(force){
  const code = currentAccessCode();
  if(!code || !navigator.onLine) return;
  if(!force && Date.now() - lastBackgroundCheck < 3600000) return;
  lastBackgroundCheck = Date.now();
  const res = await validateCodeOnline(code);
  if(res === "refused"){
    clearAccess();
    lockApp("gateRevoked");
  } else if(res === "ok" && !appUnlocked){
    unlockApp();
  }
}

async function startAccessGate(){
  const code = currentAccessCode();
  if(!code){ showGate(); return; }
  if(withinGrace()){
    // Dans le délai de grâce : on ouvre tout de suite, la revérification se fait en fond.
    unlockApp();
    revalidateInBackground(true);
    return;
  }
  // Hors délai de grâce : validation en ligne obligatoire avant d'ouvrir.
  showGate();
  const msg = document.getElementById("gateMsg");
  if(msg){ msg.hidden = false; msg.textContent = t("gateChecking"); }
  const res = await validateCodeOnline(code);
  if(res === "ok") unlockApp();
  else if(res === "refused"){
    clearAccess();
    showGate("gateRevoked");
  } else {
    showGate("gateGraceExpired");
  }
}

/* ============================================================
   RDC39 — Synchronisation automatique des digests (niveau 2)
   ------------------------------------------------------------
   Chaque visite porte syncState "pending" | "sent". Dès qu'une connexion est
   disponible (ouverture, retour du réseau, retour au premier plan, ou ~2 min après
   une modification), les entrées puis le manifeste de chaque visite en attente sont envoyés au relais,
   qui les range dans Cloudflare KV (une clé par visite, écrasée à chaque envoi).
   Pas de synchro app fermée (niveau 3, impossible sur iOS).
   ============================================================ */
const SYNC_DEBOUNCE_MS = 2 * 60 * 1000;
let syncTimer = null;
let syncInFlight = null;
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncPending(), SYNC_DEBOUNCE_MS);
}
function visitIsSent(v, entries){
  return v.syncState === "sent" && entries.every(e => e.syncState === "sent");
}
async function syncStatus(){
  const visits = await idbGetAll("visits");
  const entries = await idbGetAll("entries");
  const byVisit = {};
  entries.forEach(e => { (byVisit[e.visitUid] = byVisit[e.visitUid] || []).push(e); });
  const pendingVisits = visits.filter(v => !visitIsSent(v, byVisit[v.uid] || []));
  return {
    total: visits.length,
    pending: pendingVisits.length,
    pendingEntries: entries.filter(e => e.syncState !== "sent" && visits.some(v => v.uid === e.visitUid)).length
  };
}
function syncPending(opts){
  if(syncInFlight) return syncInFlight;
  syncInFlight = doSyncPending(opts || {}).finally(() => { syncInFlight = null; refreshSyncBadge(); });
  return syncInFlight;
}
class AccessRevoked extends Error {}
async function postToRelay(path, payload){
  const resp = await fetchWithTimeout(currentRelayUrl() + path, {
    method: "POST",
    headers: relayHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify(payload)
  }, 180000);
  if(resp.status === 401 || resp.status === 403) throw new AccessRevoked("revoked");
  if(!resp.ok){
    const txt = await resp.text().catch(() => "");
    throw new Error("HTTP " + resp.status + (txt ? " " + txt.slice(0, 120) : ""));
  }
}
/* Envoi en morceaux : d'abord chaque entr\u00e9e en attente (un objet KV par entr\u00e9e — un envoi
   coup\u00e9 sur r\u00e9seau faible ne fait perdre que l'entr\u00e9e en cours), puis le manifeste. */
async function doSyncPending(opts){
  if(!appUnlocked) return { skipped: true };
  if(!currentRelayUrl() || !currentAccessCode()) return { error: t("relayMissing") };
  if(!navigator.onLine) return { error: t("syncOffline") };
  const visits = await idbGetAll("visits");
  let sent = 0, lastError = null;
  try{
    for(const v of visits){
      const entries = (await idbGetByIndex("entries", "visitUid", v.uid)).sort((a,b) => a.timestamp - b.timestamp);
      if(visitIsSent(v, entries)) continue;
      for(const e of entries){
        if(e.syncState === "sent") continue;
        const rev = e.syncRev || 0;
        try{
          await postToRelay("/upload-entry", { visitUid: v.uid, entry: await entryToDigest(e) });
          const fresh = await idbGet("entries", e.id);
          if(fresh && (fresh.syncRev || 0) === rev){ fresh.syncState = "sent"; fresh.syncError = null; await idbPutRaw("entries", fresh); }
          sent++;
        }catch(err){
          if(err instanceof AccessRevoked) throw err;
          lastError = err.name === "AbortError" ? "timeout" : err.message;
          const fresh = await idbGet("entries", e.id);
          if(fresh){ fresh.syncError = lastError; await idbPutRaw("entries", fresh); }
        }
      }
      if(v.syncState !== "sent"){
        const rev = v.syncRev || 0;
        try{
          const current = (await idbGetByIndex("entries", "visitUid", v.uid)).sort((a,b) => a.timestamp - b.timestamp);
          await postToRelay("/upload-manifest", await buildManifest(v, current));
          const fresh = await idbGet("visits", v.uid);
          if(fresh && (fresh.syncRev || 0) === rev){
            fresh.syncState = "sent"; fresh.syncedAt = new Date().toISOString(); fresh.syncError = null;
            await idbPutRaw("visits", fresh);
          }
          sent++;
        }catch(err){
          if(err instanceof AccessRevoked) throw err;
          lastError = err.name === "AbortError" ? "timeout" : err.message;
        }
      }
    }
  }catch(err){
    if(err instanceof AccessRevoked){
      clearAccess();
      lockApp("gateRevoked");
      return { error: t("gateRevoked") };
    }
    throw err;
  }
  if(!lastError) localStorage.setItem("rdc39_last_sync", String(Date.now()));
  return lastError ? { sent, error: lastError } : { sent };
}
/* Petit indicateur dans la barre du haut : ⏳ + nombre de visites en attente. */
async function refreshSyncBadge(){
  const badge = document.getElementById("syncBadge");
  if(!badge) return;

}

/* ============================================================
   RDC39 — Espace de stockage : estimation, alerte sous 200 Mo, stockage persistant
   ------------------------------------------------------------
   Estim\u00e9 au lancement, avant chaque photo / enregistrement, puis toutes les minutes. Le
   stockage persistant est demand\u00e9 au lancement (\u00e9vite que le navigateur efface les relev\u00e9s
   pour lib\u00e9rer de la place). L'estimation est approximative selon le navigateur.
   ============================================================ */
const STORAGE_WARN_BYTES = 200 * 1024 * 1024;
let storageFree = null;       // octets libres estim\u00e9s (null = inconnu)
let storagePersisted = null;  // true / false / null (inconnu)
async function refreshStorageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      if(est && est.quota) storageFree = Math.max(0, est.quota - (est.usage || 0));
    }
  }catch(e){}
  return storageFree;
}
async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      storagePersisted = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if(!storagePersisted) storagePersisted = await navigator.storage.persist();
    }
  }catch(e){ storagePersisted = null; }
  return storagePersisted;
}
function lowStorageText(free){ return t("storageLow").replace("{free}", fmtBytes(free)); }
async function checkStorageAtLaunch(){
  await requestPersistentStorage();
  const free = await refreshStorageEstimate();
  if(free !== null && free < STORAGE_WARN_BYTES) showError(lowStorageText(free));
}
/* Avant une capture : estimation \u00e0 jour ; sous le seuil, l'utilisateur d\u00e9cide de continuer ou non. */
async function confirmStorageBeforeCapture(){
  const free = await refreshStorageEstimate();
  if(free !== null && free < STORAGE_WARN_BYTES) return confirm(errText(lowStorageText(free) + " " + t("storageContinue")));
  return true;
}
/* Variante synchrone (derni\u00e8re estimation connue) pour les gestes qui ne peuvent pas attendre
   (micro / AudioContext \u00e0 ouvrir dans le geste sur iPhone) ; l'estimation est rafra\u00eechie ensuite. */
function confirmStorageSync(){
  refreshStorageEstimate();
  if(storageFree !== null && storageFree < STORAGE_WARN_BYTES) return confirm(errText(lowStorageText(storageFree) + " " + t("storageContinue")));
  return true;
}
setInterval(refreshStorageEstimate, 60000);

/* ============================================================
   RDC39 — Enregistrements audio : assemblage des morceaux et r\u00e9cup\u00e9ration
   ============================================================ */
const REC_TIMESLICE_MS = 2000;       // un morceau \u00e9crit sur l'appareil toutes les 2 s
const REC_BITRATE = 32000;           // ~32 kbit/s : environ 2,4 Mo pour 10 minutes
// Niveau RMS max (0-1) sous lequel on consid\u00e8re que rien n'a \u00e9t\u00e9 capt\u00e9. Micro coup\u00e9/bouch\u00e9 \u2248 0,
// parole \u2248 0,02-0,3. \u00c0 calibrer sur t\u00e9l\u00e9phone r\u00e9el (cf. README).
const REC_SILENCE_THRESHOLD = 0.008;
const activeRecIds = new Set();      // enregistrements en cours dans CETTE page (jamais "orphelins")
/* Garde-fous de dur\u00e9e (d\u00e9cision du 8 octobre 2026) : rappel \u00e0 15 min (vibration + bandeau
   Continuer / Arr\u00eater) ; sans r\u00e9ponse, arr\u00eat AVEC sauvegarde 15 min plus tard (30 min apr\u00e8s le
   d\u00e9but ou la derni\u00e8re r\u00e9ponse) ; alerte apr\u00e8s 3 min de silence continu. */
const REC_REMIND_MS = 15 * 60 * 1000;
const REC_AUTOSTOP_MS = 30 * 60 * 1000;
const REC_SILENCE_ALERT_MS = 3 * 60 * 1000;
const REC_ALIVE_MS = 30 * 1000;      // un enregistrement dont les morceaux arrivent encore est "vivant"
const REC_MIN_STOP_MS = 1000;        // un appui sur Arr\u00eater dans la 1re seconde est ignor\u00e9 (double appui)
function recTiming(){ return Object.assign({ remind: REC_REMIND_MS, autostop: REC_AUTOSTOP_MS, silence: REC_SILENCE_ALERT_MS }, window.__rdc39RecTiming || {}); }
const EXIF_GPS_MAX_SKEW_MS = 2 * 60 * 1000; // GPS d'une photo : accept\u00e9 s'il date de la prise de vue (\u00b1 2 min)
const POINT_GOOD_ACCURACY_M = 5;     // Point GPS : on s'arr\u00eate d\u00e8s \u00b1 5 m...
const POINT_MAX_WAIT_MS = 30000;     // ...ou au bout de 30 s, avec la meilleure mesure obtenue
function entryGlyph(e){
  if(e.kind === "audio") return "\u{1F3A4}";
  if(e.kind === "photo") return "\u{1F4F7}";
  if(e.kind === "point") return "\u{1F4CD}";
  if(e.kind === "fichier") return fileGlyph(e.fileName);
  if(e.source === "dictee") return "\u{1F5E3}\ufe0f";
  return "\u{1F4DD}";
}
function fmtPointDetails(loc){
  if(!loc) return "";
  return loc.lat.toFixed(6) + ", " + loc.lng.toFixed(6) +
    (loc.accuracy ? " \u00b7 \u00b1 " + loc.accuracy + " m" : "") +
    (loc.altitude !== undefined && loc.altitude !== null ? " \u00b7 alt. " + loc.altitude + " m (GPS)" : "");
}
function setTextIfChanged(el, txt){ if(el && el.textContent !== txt) el.textContent = txt; }
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s2).padStart(2, "0");
}
/* Assemble les morceaux d'un enregistrement en UNE entrée audio, puis efface les morceaux.
   Renvoie l'entrée, ou null s'il n'y avait aucun son.
   Sans doublon possible (constat du 8 octobre 2026) :
   - identifiant DÉTERMINISTE "rec_<recId>" : une seconde finalisation retrouve la même entrée
     (et la même clé côté relais) au lieu d'en créer une autre ;
   - création de l'entrée + effacement des morceaux + effacement des métadonnées dans UNE seule
     transaction : tout ou rien, même si l'app est tuée au milieu ;
   - verrou entre onglets (navigator.locks) ; la récupération ignore un enregistrement encore
     vivant dans une autre instance de l'app (verrou tenu, ou morceaux récents). */
function withRecLock(fn){
  if(navigator.locks && navigator.locks.request) return navigator.locks.request("rdc39-rec-finalize", fn);
  return fn();
}
function idbFinalizeAtomic(entry, chunkIds, recId){
  return openDB().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(["entries", "audioChunks", "recordings"], "readwrite");
    if(entry) t.objectStore("entries").put(entry);
    const cs = t.objectStore("audioChunks");
    for(const id of chunkIds) cs.delete(id);
    if(recId) t.objectStore("recordings").delete(recId);
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error("transaction annulée"));
  }));
}
async function recordingAliveElsewhere(meta){
  // Verrou disponible : r\u00e9ponse exacte (il est lib\u00e9r\u00e9 d\u00e8s que l'instance qui enregistre meurt).
  if(navigator.locks && navigator.locks.query){
    try{
      const q = await navigator.locks.query();
      return (q.held || []).some(l => l.name === "rdc39-rec-" + meta.recId);
    }catch(e){}
  }
  // Repli (navigateur sans verrous) : des morceaux arriv\u00e9s il y a moins de 30 s.
  return !!(meta.aliveAt && Date.now() - meta.aliveAt < REC_ALIVE_MS);
}
async function finalizeRecordingUnlocked(recId, durationSec, recovered){
  const meta = await idbGet("recordings", recId);
  const chunks = (await idbGetByIndex("audioChunks", "recId", recId)).sort((a, b) => a.seq - b.seq);
  const entryId = "rec_" + recId;
  let entry = null, created = false;
  if(meta && chunks.length){
    entry = await idbGet("entries", entryId); // déjà finalisé : on ne recrée rien
    if(!entry){
      const total = chunks.reduce((n, c) => n + c.data.byteLength, 0);
      const out = new Uint8Array(total);
      let off = 0;
      for(const c of chunks){ out.set(new Uint8Array(c.data), off); off += c.data.byteLength; }
      const visit = await idbGet("visits", meta.visitUid);
      if(!visit){
        // Visite supprimée entre-temps : on ne jette jamais un enregistrement, on recrée une visite.
        await idbPut("visits", { uid: meta.visitUid, tag: t("recRecoveredLabel"), date: new Date(meta.startedAt).toISOString(),
          folderId: null, tags: [], trashedAt: null, operateur: currentAgent(), createdAt: new Date().toISOString() });
      }
      entry = {
        id: entryId, visitUid: meta.visitUid, kind: "audio", data: out.buffer, mime: meta.mime || "audio/webm",
        text: "", label: recovered ? t("recRecoveredLabel") : "", location: meta.location || null,
        timestamp: meta.startedAt,
        duration: durationSec != null ? durationSec : Math.round(chunks.length * REC_TIMESLICE_MS / 1000),
        recovered: !!recovered, syncState: "pending", syncRev: 1
      };
      if(!meta.location) entry.positionMotif = recovered ? "indisponible" : currentGeoMotif();
      created = true;
    }
  }
  await idbFinalizeAtomic(created ? entry : null, chunks.map(c => c.id), meta ? recId : null);
  if(created){ await markVisitPending(entry.visitUid); scheduleSync(); }
  return entry;
}
function finalizeRecording(recId, durationSec, recovered){
  return withRecLock(() => finalizeRecordingUnlocked(recId, durationSec, recovered));
}
/* Au lancement : enregistrements interrompus (app tuée, batterie, appel entrant...). */
let recoverRetryTimer = null;
async function recoverOrphanRecordings(){
  let n = 0, skipped = 0;
  try{
    const metas = await idbGetAll("recordings");
    for(const m of metas){
      if(activeRecIds.has(m.recId)) continue;
      const res = await withRecLock(async () => {
        const fresh = await idbGet("recordings", m.recId);
        if(!fresh) return null;                                   // déjà traité par une autre instance
        if(await recordingAliveElsewhere(fresh)) return "alive"; // encore en cours ailleurs : on n'y touche pas
        return finalizeRecordingUnlocked(m.recId, null, true);
      });
      if(res === "alive") skipped++;
      else if(res) n++;
    }
  }catch(e){ /* ne bloque jamais l'ouverture */ }
  // Enregistrement vu "vivant" : nouvel essai plus tard (s'il s'est arrêté sans être finalisé).
  if(skipped && !recoverRetryTimer){
    recoverRetryTimer = setTimeout(() => {
      recoverRetryTimer = null;
      recoverOrphanRecordings().then(k => { if(k) showToast(k + " " + t("recRecoveredToast")); });
    }, REC_ALIVE_MS + 5000);
  }
  return n;
}

  allIds.forEach(id => { if(!order.includes(id)) order.push(id); }); // nouvelles couches : au-dessus
  let hidden = [];
  try{ hidden = JSON.parse(localStorage.getItem("rdc39_map_hidden") || "[]"); }catch(e){}
  return { order, hidden: new Set(hidden) }; // order : du DESSOUS vers le DESSUS
}
function saveMapPrefs(order, hidden){
  localStorage.setItem("rdc39_map_order", JSON.stringify(order));
  localStorage.setItem("rdc39_map_hidden", JSON.stringify(Array.from(hidden)));
}

function tileXY(lat, lng, z){
  const n = Math.pow(2, z);
  const x = Math.floor((lng + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  return { x, y };
}
function projectTileUrls(){
  const urls = [];
  for(let z = TILE_MIN_ZOOM; z <= TILE_MAX_ZOOM; z++){
    const a = tileXY(PROJECT_BOUNDS.north, PROJECT_BOUNDS.west, z);
    const b = tileXY(PROJECT_BOUNDS.south, PROJECT_BOUNDS.east, z);
    for(let x = a.x; x <= b.x; x++){
      for(let y = a.y; y <= b.y; y++){
        urls.push(OSM_TILE_URL.replace("{z}", z).replace("{x}", x).replace("{y}", y));
      }
    }
  }
  return urls;
}
let tileDownload = null; // { done, total, failed } pendant un téléchargement en cours
async function downloadProjectTiles(onProgress){
  if(tileDownload) return;
  const urls = projectTileUrls();
  const cache = await caches.open(TILE_CACHE);
  tileDownload = { done: 0, total: urls.length, failed: 0 };
  let idx = 0;
  // 2 requêtes en parallèle au maximum : on reste raisonnable vis-à-vis des serveurs OSM.
  async function worker(){
    while(idx < urls.length){
      const url = urls[idx++];
      try{
        const hit = await cache.match(url);
        if(!hit){
          const resp = await fetch(url, { mode: "cors" });
          if(resp.ok) await cache.put(url, resp);
          else tileDownload.failed++;
        }
      }catch(err){ tileDownload.failed++; }
      tileDownload.done++;
      if(onProgress) onProgress(tileDownload);
    }
  }
  try{
    await Promise.all([worker(), worker()]);
    if(tileDownload.failed === 0) localStorage.setItem("rdc39_tiles_done_at", String(Date.now()));
    return tileDownload;
  }finally{
    const res = tileDownload;
    tileDownload = null;
    if(onProgress) onProgress(Object.assign({ finished: true }, res));
  }
}
async function countCachedTiles(){
  try{
    const cache = await caches.open(TILE_CACHE);
    const keys = await cache.keys();
    return keys.length;
  }catch(e){ return 0; }
}

            else if(def.id === "conduite") l.bindPopup(escapeHtml(def.label) + (p.Nom ? " \u2014 " + escapeHtml(p.Nom) : "") +

          }
        });
      } else {
        layer = L.geoJSON(data, { style: { color: def.color, weight: 2, fillColor: def.color, fillOpacity: 0.12 } });

      if(!hidden.has(def.id)) layer.addTo(map);

  // Couche dynamique : points déjà relevés par l'équipe (base locale)

  const visits = (await idbGetAll("visits")).filter(v => !v.trashedAt);

  const allEntries = await idbGetAll("entries");
  allEntries.filter(e => e.location && visitById[e.visitUid]).forEach(e => {
    const v = visitById[e.visitUid];
    const glyph = entryGlyph(e);
    const snippet = e.text ? escapeHtml(e.text.length > 140 ? e.text.slice(0, 140) + "…" : e.text) : "";
    // Point GPS : marqueur cercl\u00e9 de blanc, plus visible ; autres entr\u00e9es : marqueur simple.
    const marker = L.circleMarker([e.location.lat, e.location.lng], e.kind === "point"
      ? { radius: 8, fillColor: TEAM_LAYER_COLOR, color: "#fff", weight: 3, fillOpacity: 1 }
      : { radius: 6, fillColor: TEAM_LAYER_COLOR, color: "#171A16", weight: 2, fillOpacity: 0.95 });

  if(!hidden.has(TEAM_LAYER_ID)) teamLayer.addTo(map);
  applyZOrder();

  // Panneau de couches (repris de l'outil de vérification) — glisser au doigt ou à la souris
  const panel = wrap.querySelector("#mapPanel");
  const listEl = wrap.querySelector("#layerList");
  wrap.querySelector("#btnLayers").addEventListener("click", () => { panel.hidden = !panel.hidden; if(!panel.hidden) refreshTileInfo(); });
  map.on("click", () => { panel.hidden = true; });

  function renderLayerList(){
    listEl.innerHTML = "";
    const displayOrder = [...order].reverse(); // dessus en premier, plus intuitif à lire
    displayOrder.forEach(id => {
      const def = defsById[id];
      if(!def) return;
      const li = document.createElement("li");
      li.className = "layer-row";
      li.dataset.id = id;
      const available = !!leafletLayers[id];
      const checked = available && map.hasLayer(leafletLayers[id]);
      li.innerHTML = `
        <span class="drag-handle" aria-label="${t("mapDrag")}">⋮⋮</span>
        <label>
          <input type="checkbox" ${checked ? "checked" : ""} ${available ? "" : "disabled"}>
          <span class="swatch" style="background:${def.color}"></span><span>${escapeHtml(def.label)}</span>
        </label>
      `;
      li.querySelector("input").addEventListener("change", (e) => {
        if(e.target.checked){ leafletLayers[id].addTo(map); hidden.delete(id); applyZOrder(); }
        else { map.removeLayer(leafletLayers[id]); hidden.add(id); }
        saveMapPrefs(order, hidden);
      });
      wireDrag(li.querySelector(".drag-handle"), li);
      listEl.appendChild(li);
    });
  }
  /* Réordonnancement par pointeur (fonctionne au doigt, contrairement au drag & drop HTML5
     du prototype, inopérant sur mobile). On déplace la ligne dans la liste pendant le geste,
     puis on reconstruit `order` (dessous -> dessus) au relâchement. */
  function wireDrag(handle, row){
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      row.classList.add("dragging");
      const onMove = (ev) => {
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const over = el && el.closest(".layer-row");
        if(!over || over === row || over.parentNode !== listEl) return;
        const rect = over.getBoundingClientRect();
        const after = ev.clientY > rect.top + rect.height / 2;
        listEl.insertBefore(row, after ? over.nextSibling : over);
      };
      const onUp = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        row.classList.remove("dragging");
        const displayOrder = Array.from(listEl.querySelectorAll(".layer-row")).map(r => r.dataset.id);
        order = displayOrder.reverse();
        saveMapPrefs(order, hidden);
        applyZOrder();
      };
      // Écoute sur window (pas de setPointerCapture) : déplacer la ligne dans le DOM
      // annulerait la capture et on perdrait le relâchement.
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
  }
  renderLayerList();

  // Position GPS en direct
  let meMarker = null, meCircle = null, mapFix = null, watchId = null;
  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition((pos) => {
      recordFix(pos); // alimente aussi le statut de position global
      mapFix = [pos.coords.latitude, pos.coords.longitude];
      const acc = pos.coords.accuracy || 0;
      if(!meMarker){
        meCircle = L.circle(mapFix, { radius: acc, color: "#3182ce", weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
        meMarker = L.circleMarker(mapFix, { radius: 7, fillColor: "#3182ce", color: "#fff", weight: 3, fillOpacity: 1 }).addTo(map);
        meMarker.bindPopup(t("mapMe"));
      } else {
        meMarker.setLatLng(mapFix); meCircle.setLatLng(mapFix); meCircle.setRadius(acc);
      }
    }, recordGeoError, { enableHighAccuracy: true, maximumAge: 0 });
  }
  wrap.querySelector("#btnLocate").addEventListener("click", () => {
    if(mapFix) map.setView(mapFix, Math.max(map.getZoom(), 16));
    else showError(t("mapNoFix"));
  });
  wrap.querySelector("#btnFit").addEventListener("click", () => {
    map.fitBounds([[PROJECT_BOUNDS.south, PROJECT_BOUNDS.west], [PROJECT_BOUNDS.north, PROJECT_BOUNDS.east]]);
  });

  // Fond de carte hors-ligne : uniquement sur demande explicite
  const tileInfo = wrap.querySelector("#tileInfo");
  const btnTiles = wrap.querySelector("#btnTiles");
  const totalTiles = projectTileUrls().length;
  async function refreshTileInfo(){
    if(tileDownload){ tileInfo.textContent = t("mapDownloading") + " " + tileDownload.done + " / " + tileDownload.total; return; }
    const n = await countCachedTiles();
    const doneAt = Number(localStorage.getItem("rdc39_tiles_done_at") || "0");
    tileInfo.textContent = Math.min(n, totalTiles) + " / " + totalTiles + " " + t("mapTilesCached") +
      (doneAt ? " — " + t("mapTilesDoneAt") + " " + fmtDate(new Date(doneAt).toISOString()) : "");
  }
  btnTiles.addEventListener("click", async () => {
    if(!navigator.onLine){ showError(t("syncOffline")); return; }
    if(!confirm(t("mapDownloadConfirm").replace("{n}", totalTiles))) return;
    btnTiles.disabled = true;
    const res = await downloadProjectTiles((p) => {
      if(!wrap.isConnected) return;
      tileInfo.textContent = p.finished ? "" : t("mapDownloading") + " " + p.done + " / " + p.total;
    });
    btnTiles.disabled = false;
    if(res && res.failed) showError(res.failed + " " + t("mapTilesFailed"));
    else showToast(t("mapDownloadDone"));
    if(wrap.isConnected) refreshTileInfo();
  });

  setTimeout(() => map.invalidateSize(), 50);
  currentViewCleanup = () => {
    if(watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    map.remove();
    document.body.classList.remove("map-mode");
  };
}

/* ============================================================
   RDC39 — Export groupé de la sélection (accueil, mode sélection)
   ------------------------------------------------------------
   UN fichier ZIP (ou plusieurs au-delà de ~80 Mo estimés) : un digest JSON par visite
   (contenu identique à "Exporter (digest JSON)" d'une visite) + index.json.
   Mémoire : une visite à la fois (digest -> JSON -> octets -> Blob, puis libéré) ; le ZIP
   n'est qu'une liste de Blobs. Une visite vide ou illisible n'arrête rien : index.json la
   signale. Livraison : bouton (geste de l'utilisateur) -> partage natif sur mobile s'il
   est disponible, sinon téléchargement ; jamais de téléchargements en rafale.
   ============================================================ */
const ZIP_SPLIT_DEFAULT_BYTES = 80 * 1024 * 1024;
function zipSplitBytes(){ return window.__rdc39ZipSplitBytes || ZIP_SPLIT_DEFAULT_BYTES; } // (seuil réglable par les tests)
function asciiFileName(s, max){
  return (s || "visite").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9-_]+/g, "_").replace(/^_+|_+$/g, "").slice(0, max || 40) || "visite";
}
function pad2n(n){ return String(n).padStart(2, "0"); }
function digestFileName(v){
  const d = new Date(v.date);
  const day = isFinite(d) ? d.getFullYear() + "-" + pad2n(d.getMonth() + 1) + "-" + pad2n(d.getDate()) : "sans-date";
  return day + "_" + asciiFileName(v.tag || "visite", 40) + "_" + String(v.uid || "").slice(0, 8) + ".json";
}
function exportZipName(now, nVisits, part, parts){
  const stamp = now.getFullYear() + "-" + pad2n(now.getMonth() + 1) + "-" + pad2n(now.getDate()) + "_" + pad2n(now.getHours()) + pad2n(now.getMinutes());
  return "RDC39_export_" + stamp + "_" + nVisits + "-visites" + (parts > 1 ? "_partie-" + part + "-sur-" + parts : "") + ".zip";
}
/* Poids estimé d'un digest : binaire en base64 (x 4/3) + textes + enveloppe JSON. */
async function estimateVisitExport(v){
  const entries = await idbGetByIndex("entries", "visitUid", v.uid);
  let bytes = 2048;
  for(const e of entries) bytes += Math.ceil(getEntrySize(e) * 4 / 3) + (e.text ? e.text.length * 1.1 : 0) + 400;
  return { visit: v, entries: entries.length, bytes: Math.round(bytes) };
}
/* Découpage glouton dans l'ordre : chaque ZIP reste sous le seuil (une visite plus grosse que le
   seuil part seule dans son ZIP). */
function planZipGroups(items, limit){
  const groups = [];
  let cur = [], size = 0;
  for(const it of items){
    if(cur.length && size + it.bytes > limit){ groups.push(cur); cur = []; size = 0; }
    cur.push(it); size += it.bytes;
  }
  if(cur.length) groups.push(cur);
  return groups;
}
function isMobileDevice(){ const pf = devicePlatform(); return pf === "ios" || pf === "android"; }
function canShareFile(file){
  try{ return !!(isMobileDevice() && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); }
  catch(e){ return false; }
}
function saveBlobAs(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function exportSelectedVisits(ids, onDone){
  const visits = [];
  for(const id of ids){ const v = await idbGet("visits", id); if(v) visits.push(v); }
  visits.sort((a, b) => new Date(a.date) - new Date(b.date));
  if(!visits.length){ showError(t("bulkNothing")); if(onDone) onDone({ delivered: false }); return; }

  // ---- 1. Estimation et confirmation ----
  const items = [];
  for(const v of visits){
    try{ items.push(await estimateVisitExport(v)); }
    catch(e){ items.push({ visit: v, entries: 0, bytes: 2048 }); }
  }
  const totalEntries = items.reduce((n, it) => n + it.entries, 0);
  const totalBytes = items.reduce((n, it) => n + it.bytes, 0);
  const groups = planZipGroups(items, zipSplitBytes());

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal-sheet bulk-sheet"></div>`;
  document.body.appendChild(overlay);
  const sheet = overlay.firstElementChild;
  const created = [];   // { blob, name } à libérer en fermant
  let delivered = false; // au moins un fichier partag\u00e9 ou t\u00e9l\u00e9charg\u00e9
  const close = () => { overlay.remove(); created.length = 0; if(onDone) onDone({ delivered }); };
  const markDelivered = () => { delivered = true; try{ localStorage.setItem("rdc39_last_backup", String(Date.now())); }catch(e){} };

  sheet.innerHTML = `
    <h3>\u{1F4E6} ${t("bulkTitle")}</h3>
    <p class="bulk-summary" id="bulkSummary">${visits.length} ${t("bulkVisits")} · ${totalEntries} ${t("bulkEntries")} · ${t("bulkEstimated")} ${fmtBytes(totalBytes)}</p>
    ${groups.length > 1 ? `<p class="capture-hint" id="bulkSplit">${t("bulkSplit").replace("{n}", groups.length).replace("{max}", fmtBytes(zipSplitBytes()))}</p>` : ""}
    <p class="capture-hint">${t("bulkHint")}</p>
    <button class="btn primary" id="bulkGo" style="width:100%; margin-bottom:8px;">${t("bulkStart")}</button>
    <button class="btn" id="bulkCancel" style="width:100%;">${t("cancel")}</button>`;
  const go = await new Promise(resolve => {
    sheet.querySelector("#bulkGo").addEventListener("click", () => resolve(true));
    sheet.querySelector("#bulkCancel").addEventListener("click", () => resolve(false));
  });
  if(!go){ close(); return; }

  // ---- 2. Construction, une visite à la fois ----
  let cancelled = false;
  sheet.innerHTML = `
    <h3>\u{1F4E6} ${t("bulkTitle")}</h3>
    <p class="bulk-progress-label" id="bulkLabel">…</p>
    <div class="bulk-bar"><div class="bulk-bar-fill" id="bulkFill"></div></div>
    <p class="capture-hint" id="bulkCount"></p>
    <button class="btn" id="bulkStop" style="width:100%;">${t("bulkCancel")}</button>`;
  sheet.querySelector("#bulkStop").addEventListener("click", () => { cancelled = true; sheet.querySelector("#bulkStop").disabled = true; });
  const label = sheet.querySelector("#bulkLabel"), fill = sheet.querySelector("#bulkFill"), count = sheet.querySelector("#bulkCount");
  const now = new Date();
  let doneBytes = 0, doneVisits = 0, problems = 0;
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  try{
    for(let g = 0; g < groups.length && !cancelled; g++){
      const zip = createZipBuilder({ date: now });
      const index = {
        schema: "rdc39-export-index", schemaIndex: 1, schemaDigest: SCHEMA_VERSION,
        app: APP_VERSION, genereLe: now.toISOString(), appareil: deviceId(), operateur: currentAgent(),
        partie: g + 1, parties: groups.length, visitesSelectionnees: visits.length, visites: []
      };
      for(const it of groups[g]){
        if(cancelled) break;
        const v = it.visit;
        setTextIfChanged(label, t("bulkVisitOf").replace("{i}", doneVisits + 1).replace("{n}", visits.length) + " : " + (v.tag || "—"));
        await yieldUI();
        const row = { fichier: null, uid: v.uid, repere: v.tag || null, date: v.date || null, operateur: visitOperator(v), entrees: it.entries, taille: 0, statut: "ok" };
        try{
          // Même contenu que l'export "digest JSON" d'une visite.
          let digest = await buildDigest(v);
          const bad = (digest.entries || []).filter(e => e.erreur).map(e => ({ id: e.id, type: e.type, erreur: e.erreur }));
          row.entrees = (digest.entries || []).length;
          let bytes = new TextEncoder().encode(JSON.stringify(digest));
          digest = null;
          row.fichier = zip.add(digestFileName(v), bytes);
          row.taille = bytes.length;
          bytes = null; // le Blob du ZIP garde les données ; la copie JS est libérée
          if(row.entrees === 0){ row.statut = "vide"; problems++; }
          if(bad.length){ row.statut = row.statut === "vide" ? "vide" : "partiel"; row.entreesEnErreur = bad; problems++; }
        }catch(err){
          row.statut = "erreur";
          row.erreur = errText((err && (err.message || err.name)) || String(err));
          problems++;
        }
        index.visites.push(row);
        doneVisits++; doneBytes += it.bytes;
        fill.style.width = Math.min(100, Math.round(doneBytes / Math.max(1, totalBytes) * 100)) + "%";
        setTextIfChanged(count, doneVisits + " / " + visits.length + " · " + fmtBytes(doneBytes) + " / ~" + fmtBytes(totalBytes));
      }
      if(cancelled) break;
      index.visitesDansCeFichier = index.visites.length;
      zip.add("index.json", JSON.stringify(index, null, 1));
      created.push({ blob: zip.finish(), name: exportZipName(now, index.visites.length, g + 1, groups.length) });
    }
  }catch(err){
    showError(t("bulkFailed") + " : " + ((err && (err.message || err.name)) || err));
    close();
    return;
  }
  if(cancelled){ showToast(t("bulkCancelled")); close(); return; }

  // ---- 3. Livraison : un bouton par fichier (geste de l'utilisateur, requis pour le partage) ----
  sheet.innerHTML = `
    <h3>✅ ${t("bulkReady")}</h3>
    <p class="bulk-summary">${visits.length} ${t("bulkVisits")} · ${created.length} ${t("bulkFiles")}${problems ? " · " + problems + " " + t("bulkProblems") : ""}</p>
    ${problems ? `<p class="capture-hint bulk-warn">${escapeHtml(errText(t("bulkProblemsHint")))}</p>` : ""}
    <div id="bulkFilesList"></div>
    <button class="btn" id="bulkClose" style="width:100%; margin-top:8px;">${t("close")}</button>`;
  const list = sheet.querySelector("#bulkFilesList");
  for(const c of created){
    const file = (typeof File !== "undefined") ? new File([c.blob], c.name, { type: "application/zip" }) : c.blob;
    const row = document.createElement("div");
    row.className = "bulk-file";
    row.innerHTML = `<div class="bulk-file-name">${escapeHtml(c.name)} <span class="storage-line">(${fmtBytes(c.blob.size)})</span></div><div class="bulk-file-actions"></div>`;
    const actions = row.querySelector(".bulk-file-actions");
    if(canShareFile(file)){
      const share = document.createElement("button");
      share.className = "btn primary"; share.textContent = "\u{1F4E4} " + t("bulkShare");
      share.addEventListener("click", async () => {
        try{ await navigator.share({ files: [file], title: c.name }); markDelivered(); }
        catch(err){ if(!err || err.name !== "AbortError") showError(t("bulkShareFailed") + " (" + ((err && err.name) || "?") + ")"); }
      });
      actions.appendChild(share);
    }
    const dl = document.createElement("button");
    dl.className = "btn" + (actions.children.length ? "" : " primary");
    dl.textContent = "⬇️ " + t("bulkDownload");
    dl.addEventListener("click", () => { saveBlobAs(c.blob, c.name); markDelivered(); });
    actions.appendChild(dl);
    list.appendChild(row);
  }
  sheet.querySelector("#bulkClose").addEventListener("click", close);
}

/* ============================================================
   RDC39 — Suppressions protégées
   ------------------------------------------------------------
   - Mise à la corbeille (récupérable) : fenêtre de confirmation indiquant ce qui n'a pas
     encore été envoyé au relais, avec sauvegarde ZIP proposée AVANT.
   - Suppression définitive (corbeille) : idem + mot à taper (SUPPRIMER).
   - Entrée (✕) : confirmation (une entrée ne passe pas par la corbeille).
   Annuler est toujours le choix le plus visible ; toucher à côté annule.
   ============================================================ */
async function unsentVisitCount(ids){
  let n = 0;
  for(const id of ids){
    const v = await idbGet("visits", id);
    if(!v) continue;
    const entries = await idbGetByIndex("entries", "visitUid", id);
    if(!visitIsSent(v, entries)) n++;
  }
  return n;
}
function dangerSheet(opts){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const word = opts.typedWord || "";
    overlay.innerHTML = `<div class="modal-sheet del-sheet">
      <h3>${escapeHtml(opts.title)}</h3>
      ${opts.body.map(l => `<p class="capture-hint ${l.cls || ""}" style="margin:0 0 10px 0;">${escapeHtml(l.text)}</p>`).join("")}
      <p class="del-backup-done" id="delBackupDone" hidden>${escapeHtml(t("delBackupDone"))}</p>
      ${opts.backupIds ? `<button class="btn primary" id="delBackup">${t("delBackupFirst")}</button>` : ""}
      <button class="btn${opts.backupIds ? "" : " primary"}" id="delCancel">${t("cancel")}</button>
      ${word ? `<label class="capture-hint" for="delType" style="display:block; margin:14px 0 0 0;">${escapeHtml(t("delTypePrompt").replace("{w}", word))}</label>
      <input id="delType" class="del-type" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">` : ""}
      <button class="btn danger" id="delGo" ${word ? "disabled" : ""} style="${word ? "" : "margin-top:10px;"}">${escapeHtml(opts.confirmLabel)}</button>
    </div>`;
    document.body.appendChild(overlay);
    const done = (ok) => { overlay.remove(); resolve(ok); };
    overlay.addEventListener("click", (e) => { if(e.target === overlay) done(false); });
    overlay.querySelector("#delCancel").addEventListener("click", () => done(false));
    const go = overlay.querySelector("#delGo");
    go.addEventListener("click", () => { if(!go.disabled) done(true); });
    if(word){
      const inp = overlay.querySelector("#delType");
      const norm = (x) => String(x).trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      inp.addEventListener("input", () => { go.disabled = norm(inp.value) !== norm(word); });
    }
    const b = overlay.querySelector("#delBackup");
    if(b) b.addEventListener("click", () => {
      overlay.style.display = "none";
      exportSelectedVisits(opts.backupIds, (res) => {
        overlay.style.display = "";
        if(res && res.delivered){ overlay.querySelector("#delBackupDone").hidden = false; b.classList.remove("primary"); }
      });
    });
  });
}
async function confirmTrashVisits(ids){
  const unsent = await unsentVisitCount(ids);
  return dangerSheet({
    title: t("delTrashTitle").replace("{n}", ids.length),
    body: [{ text: t("delTrashBody") }, unsent ? { text: t("delUnsent").replace("{n}", unsent), cls: "del-warn" } : { text: t("delAllSent"), cls: "del-ok" }],
    backupIds: ids,
    confirmLabel: t("delConfirmTrash")
  });
}
async function confirmDeleteForever(ids){
  const unsent = await unsentVisitCount(ids);
  return dangerSheet({
    title: t("delForeverTitle").replace("{n}", ids.length),
    body: [{ text: t("delForeverBody"), cls: "del-warn" }, unsent ? { text: t("delUnsent").replace("{n}", unsent), cls: "del-warn" } : { text: t("delAllSent"), cls: "del-ok" }],
    backupIds: ids,
    typedWord: t("delTypeWord"),
    confirmLabel: t("delConfirmForever")
  });
}
function confirmDeleteEntry(entry){
  const txt = (entry.text || "").trim();
  const desc = entryGlyph(entry) + " " + fmtTime(entry.timestamp) + (entry.label ? " · " + entry.label : "")
    + (txt ? " — « " + txt.slice(0, 80) + (txt.length > 80 ? "…" : "") + " »" : "");
  const body = [{ text: desc }, { text: t("delEntryBody") }];
  if(entry.syncState !== "sent") body.push({ text: t("delEntryUnsent"), cls: "del-warn" });
  return dangerSheet({ title: t("delEntryTitle"), body, confirmLabel: t("delEntryConfirm") });
}

/* ============================================================
   Routeur : #home | #new | #visit/<uid> | #report/<uid> | #settings | #map
   ============================================================ */
const main = document.getElementById("main");
const pageTitle = document.getElementById("pageTitle");
const btnBack = document.getElementById("btnBack");
const btnSettings = document.getElementById("btnSettings");
const btnFolders = document.getElementById("btnFolders");
const btnMap = document.getElementById("btnMap");
const fabNew = document.getElementById("fabNew");

window.addEventListener("hashchange", route);
btnBack.addEventListener("click", () => { window.location.hash = "#home"; });
btnSettings.addEventListener("click", () => { window.location.hash = "#settings"; });
btnFolders.addEventListener("click", () => { window.location.hash = "#folders"; });
btnMap.addEventListener("click", () => { window.location.hash = "#map"; });
document.getElementById("geoBadge").addEventListener("click", () => showGeoSheet(false));
fabNew.addEventListener("click", () => { window.location.hash = "#new"; });

function route(){
  if(!appUnlocked) return;
  document.documentElement.style.setProperty("--appbar-h", document.getElementById("appbar").offsetHeight + "px");
  if(currentViewCleanup){ try{ currentViewCleanup(); }catch(e){} currentViewCleanup = null; }
  const hash = window.location.hash || "#home";
  pageTitle.textContent = t("appName");
  refreshSyncBadge();
  if(hash === "#home"){
    btnBack.hidden = true; fabNew.hidden = false;
    renderHome();
  } else if(hash === "#new"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("newVisit");
    renderNewVisit();
  } else if(hash === "#settings"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("settings");
    renderSettings();
  } else if(hash === "#map"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("map");
    renderMap();
  } else if(hash === "#folders"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("folders");
    renderFolders();
  } else if(hash === "#trash"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("trash");
    renderTrash();
  } else if(hash.startsWith("#report/")){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("reportTitle");
    renderReport(hash.slice(8));
  } else if(hash.startsWith("#visit/")){
    btnBack.hidden = false; fabNew.hidden = true;
    renderVisitDetail(hash.slice(7));
  } else {
    window.location.hash = "#home";
  }
}

   Vue : accueil

let filterState = { search: "", period: "", folder: null };
let selectMode = false;
let selectedIds = new Set();

async function renderHome(){
  main.innerHTML = "";
  fabNew.hidden = selectMode;

  const toolbar = document.createElement("div");
  toolbar.className = "home-toolbar";
  if(!selectMode){
    toolbar.innerHTML = `<button id="btnEnterSelect">${t("selectMode")}</button>`;
  }
  main.appendChild(toolbar);

  let selectBar = null;
  if(selectMode){
    selectBar = document.createElement("div");
    selectBar.className = "select-bar";
    main.appendChild(selectBar);
  }

  if(filterState.folder){
    const label = filterState.folder === "unfiled" ? t("unfiled") : await folderPathLabel(filterState.folder);
    const activeFolder = document.createElement("div");
    activeFolder.className = "active-folder";
    activeFolder.innerHTML = `<span>\u{1F4C1} ${escapeHtml(label)}</span><button id="btnClearFolder">${t("activeFolderClear")}</button>`;
    main.appendChild(activeFolder);
    activeFolder.querySelector("#btnClearFolder").addEventListener("click", () => { filterState.folder = null; route(); });
  }

  const filters = document.createElement("div");
  filters.className = "filters";
  filters.innerHTML = `
    <select id="fPeriod">
      <option value="">${t("filterAllPeriod")}</option>
      <option value="7">${t("period7")}</option>
      <option value="30">${t("period30")}</option>
    </select>
    <input type="search" id="fSearch" placeholder="${t("search")}">
  `;
  main.appendChild(filters);
  const listEl = document.createElement("div");
  listEl.className = "visit-list";
  main.appendChild(listEl);

  if(!selectMode){
    toolbar.querySelector("#btnEnterSelect").addEventListener("click", () => {
      selectMode = true; selectedIds = new Set(); route();
    });
  }

  function renderSelectBar(){
    if(!selectBar) return;
    selectBar.innerHTML = `
      <span class="count">${selectedIds.size} ${t("selectedCount")}</span>
      <button class="btn primary" id="btnExportSelected" ${selectedIds.size === 0 ? "disabled" : ""}>\u{1F4E6} ${t("bulkAction")}</button>
      <div class="actions">
        <button class="btn" id="btnMoveSelected" ${selectedIds.size === 0 ? "disabled" : ""}>${t("moveSelected")}</button>
        <button class="btn" id="btnCancelSelect">${t("selectCancel")}</button>
      </div>
      <div class="select-danger">
        <button id="btnDeleteSelected" ${selectedIds.size === 0 ? "disabled" : ""}>${t("deleteSelected")}</button>
      </div>
    `;
    selectBar.querySelector("#btnCancelSelect").addEventListener("click", () => {
      selectMode = false; selectedIds = new Set(); route();
    });
    selectBar.querySelector("#btnExportSelected").addEventListener("click", async () => {
      if(selectedIds.size === 0) return;
      // La s\u00e9lection est conserv\u00e9e : on peut relancer l'export ou d\u00e9placer/supprimer ensuite.
      await exportSelectedVisits(Array.from(selectedIds));
    });
    selectBar.querySelector("#btnMoveSelected").addEventListener("click", async () => {
      if(selectedIds.size === 0) return;
      await showFolderPicker(async (folderId) => {
        const ids = Array.from(selectedIds);
        for(const uid2 of ids){
          const v = await idbGet("visits", uid2);
          if(v){ v.folderId = folderId; await idbPut("visits", v); }
        }
        showToast(ids.length + " " + t("movedSelectedCount"));
        selectMode = false; selectedIds = new Set();
        route();
      });
    });
    selectBar.querySelector("#btnDeleteSelected").addEventListener("click", async () => {
      if(selectedIds.size === 0) return;
      const ids = Array.from(selectedIds);
      if(!(await confirmTrashVisits(ids))) return;
      for(const uid2 of ids){
        const v = await idbGet("visits", uid2);
        if(v){ v.trashedAt = Date.now(); await idbPut("visits", v); }
      }
      showToast(ids.length + " " + t("trashedSelectedCount"));
      selectMode = false; selectedIds = new Set();
      route();
    });
  }
  renderSelectBar();

  filters.querySelector("#fPeriod").value = filterState.period;
  filters.querySelector("#fSearch").value = filterState.search;
  filters.querySelector("#fPeriod").addEventListener("change", e => { filterState.period = e.target.value; refreshList(); });
  filters.querySelector("#fSearch").addEventListener("input", e => { filterState.search = e.target.value; refreshList(); });

  async function refreshList(){
    let visits = await idbGetAll("visits");
    visits = visits.filter(v => !v.trashedAt);
    visits.sort((a,b) => new Date(b.date) - new Date(a.date));
    if(filterState.folder === "unfiled") visits = visits.filter(v => !v.folderId);
    else if(filterState.folder) visits = visits.filter(v => v.folderId === filterState.folder);
    if(filterState.period){
      const cutoff = Date.now() - Number(filterState.period) * 86400000;
      visits = visits.filter(v => new Date(v.date).getTime() >= cutoff);
    }
    let entriesByVisit = {};
    if(filterState.search){
      const q = filterState.search.toLowerCase();
      const kept = [];
      for(const v of visits){
        const entries = await idbGetByIndex("entries", "visitUid", v.uid);
        entriesByVisit[v.uid] = entries;
        const hay = [v.tag, ...(v.tags || []), ...entries.map(e => e.text || ""), ...entries.map(e => e.label || "")].join(" ").toLowerCase();
        if(hay.includes(q)) kept.push(v);
      }
      visits = kept;
    }

    if(visits.length === 0){
      listEl.innerHTML = `<div class="empty-state"><div class="glyph">\u{1F4D3}</div><p><strong>${t("emptyTitle")}</strong></p><p>${t("emptyBody")}</p></div>`;
      return;
    }
    listEl.innerHTML = "";
    for(const v of visits){
      const entries = entriesByVisit[v.uid] || await idbGetByIndex("entries", "visitUid", v.uid);
      const nAudio = entries.filter(e => e.kind === "audio").length;
      const nPoint = entries.filter(e => e.kind === "point").length;
      const nPhoto = entries.filter(e => e.kind === "photo").length;
      const nText = entries.filter(e => e.kind === "texte").length;
      const isSelected = selectedIds.has(v.uid);
      const card = document.createElement("button");
      card.className = "visit-card" + (isSelected ? " selected" : "");
      card.innerHTML = `
        ${selectMode ? `<div class="check">${isSelected ? "\u2713" : ""}</div>` : `<div class="glyph">${VISIT_GLYPH}</div>`}
        <div class="info">
          <div class="tag">${escapeHtml(v.tag) || "\u2014"}</div>
          <div class="meta">${fmtDate(v.date)}${visitIsSent(v, entries) ? " \u00b7 \u2713" : " \u00b7 \u23F3"}</div>
        </div>
        <div class="counts">
          ${nAudio ? `<span>\u{1F3A4} ${nAudio}</span>` : ""}
          ${nPoint ? `<span>\u{1F4CD} ${nPoint}</span>` : ""}
          ${nPhoto ? `<span>\u{1F4F7} ${nPhoto}</span>` : ""}
          ${nText ? `<span>\u{1F4DD} ${nText}</span>` : ""}
        </div>
      `;
      if(selectMode){
        card.addEventListener("click", () => {
          if(selectedIds.has(v.uid)) selectedIds.delete(v.uid); else selectedIds.add(v.uid);
          renderSelectBar();
          card.classList.toggle("selected");
          card.querySelector(".check").textContent = selectedIds.has(v.uid) ? "\u2713" : "";
        });
      } else {
        card.addEventListener("click", () => { window.location.hash = "#visit/" + v.uid; });
      }
      listEl.appendChild(card);
    }
  }
  refreshList();
}

  /* Position d'une nouvelle entr\u00e9e sans faire attendre l'utilisateur : derni\u00e8re mesure si
     r\u00e9cente ; sinon l'entr\u00e9e est enregistr\u00e9e tout de suite et la position lui est rattach\u00e9e
     d\u00e8s qu'elle arrive (si personne ne l'a renseign\u00e9e \u00e0 la main entre-temps). */
  const LATE_FIX_WINDOW_MS = 2 * 60 * 1000; // au-del\u00e0, on aurait pu bouger : on n'attache plus
  const RETRY_PAUSE_MS = 3000;
  /* L'entr\u00e9e est d\u00e9j\u00e0 sauvegard\u00e9e ; on lui rattache la position d\u00e8s qu'elle arrive :
     tentatives r\u00e9p\u00e9t\u00e9es pendant GEO_TIMEOUT_MS (~20 s), puis \u00e9coute du suivi continu jusqu'\u00e0
     LATE_FIX_WINDOW_MS. Si rien n'arrive dans les ~20 s, le motif est enregistr\u00e9 (positionMotif) ;
     il sera retir\u00e9 automatiquement si une position arrive ensuite dans la fen\u00eatre. */
  function attachPositionLater(entryId, entryTs){
    const startedAt = Date.now();
    const notBefore = (entryTs || startedAt) - FIX_MAX_AGE_MS; // jamais un relev\u00e9 ant\u00e9rieur \u00e0 l'entr\u00e9e
    const deadline = startedAt + GEO_TIMEOUT_MS;
    let done = false;
    const stop = () => { done = true; geoListeners.delete(onGeo); };
    const attach = async (loc) => {
      if(done || !loc || Date.now() - startedAt > LATE_FIX_WINDOW_MS) return;
      stop();
      const e = await idbGet("entries", entryId);
      if(!e || e.location) return;
      e.location = loc;
      await idbPut("entries", e);
      if(main.isConnected && entryList.isConnected) refreshEntries();
    };
    const recordMotif = async (motif) => {
      const e = await idbGet("entries", entryId);
      if(!e || e.location || e.positionMotif === motif) return;
      e.positionMotif = POSITION_MOTIFS.includes(motif) ? motif : "indisponible";
      await idbPut("entries", e);
      if(main.isConnected && entryList.isConnected) refreshEntries();
    };
    const onGeo = () => {
      if(Date.now() - startedAt > LATE_FIX_WINDOW_MS){ geoListeners.delete(onGeo); return; }
      if(geoState === "ok") attach(freshFix(notBefore));
    };
    geoListeners.add(onGeo);
    const attempt = async () => {
      if(done) return;
      const r = await getPositionResult(Math.max(3000, deadline - Date.now()), { notBefore });
      if(r.loc){ attach(r.loc); return; }
      if(done) return;
      if(r.motif === "refusee" || r.motif === "non_supportee" || Date.now() + RETRY_PAUSE_MS >= deadline){
        await recordMotif(r.motif);
        if(r.motif === "non_supportee") stop(); // inutile d'\u00e9couter : il n'y aura jamais de position
        return;
      }
      setTimeout(attempt, RETRY_PAUSE_MS);
    };
    attempt();
  }
  async function putEntryWithPosition(entry){
    if(entry.location === undefined) entry.location = freshFix();
    await idbPut("entries", entry);
    if(!entry.location) attachPositionLater(entry.id, entry.timestamp);
    return entry;
  }

      const body = card.querySelector(".entry-body");
      if(entry.kind === "audio"){

        body.querySelector("textarea").addEventListener("input", (e) => {

        });

        body.appendChild(media.get(entry, (url) => {
          const a = document.createElement("a");

          a.style.cssText = "display:block; text-align:center; text-decoration:none;";

          return a;
        }));
      } else {
        body.innerHTML = `<textarea>${escapeHtml(entry.text || "")}</textarea>`;
        let tTimer = null;
        body.querySelector("textarea").addEventListener("input", (e) => {
          clearTimeout(tTimer);
          tTimer = setTimeout(async () => { entry.text = e.target.value; await idbPut("entries", entry); }, 500);
        });
      }
      card.querySelector(".del").addEventListener("click", async () => {
        if(!(await confirmDeleteEntry(entry))) return;

        showToast(t("entryDeleted"));
        refreshEntries(); refreshWeight();
      });
      card.querySelector('[data-act="label"]').addEventListener("click", async () => {
        const choice = await chooseRepere({ title: t("repereTitle"), entry, visitUid: visit.uid });
        if(choice){
          entry.label = choice.label;
          if(choice.theme) entry.theme = choice.theme; else delete entry.theme;
          await migrateEntryIfLegacy(entry); await idbPut("entries", entry); refreshEntries();
        }
      });
      card.querySelectorAll('[data-act="position"]').forEach(btn => btn.addEventListener("click", async () => {
        // Sans position : on propose directement la position actuelle (si une mesure r\u00e9cente existe).
        const nowFix = entry.location ? null : peekFreshFix();
        const current = entry.location ? entry.location.lat + ", " + entry.location.lng
          : nowFix ? nowFix.lat.toFixed(6) + ", " + nowFix.lng.toFixed(6) : "";
        const val = prompt(t("editPositionPrompt") + (nowFix ? "\n" + t("editPositionCurrentHint") + " (\u00b1 " + nowFix.accuracy + " m)" : ""), current);
        if(val === null) return;
        const trimmed = val.trim();
        if(trimmed === ""){
          entry.location = null;
          entry.clearLocation = true;
          entry.positionMotif = "indisponible";
          await migrateEntryIfLegacy(entry); await idbPut("entries", entry);
          showToast(t("editPositionCleared"));
          refreshEntries();
          return;
        }
        const parts = trimmed.split(",").map(s => s.trim());
        const lat = parts.length === 2 ? Number(parts[0]) : NaN;
        const lng = parts.length === 2 ? Number(parts[1]) : NaN;
        if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180){
          showError(t("editPositionInvalid"));
          return;
        }
        if(entry.location && val.trim() === current){ return; } // inchang\u00e9e : on garde la position d'origine (pr\u00e9cision, fixTs...)
        // Position actuelle accept\u00e9e telle quelle : relev\u00e9 GPS complet (si toujours frais) ; sinon saisie manuelle (sans fixTs).
        entry.location = (nowFix && val.trim() === current && fixIsFresh(nowFix)) ? claimFix(nowFix) : { lat, lng };
        await migrateEntryIfLegacy(entry); await idbPut("entries", entry);
        showToast(t("editPositionSaved"));
        refreshEntries();
      }));
      entryList.appendChild(card);
    }
    media.end();
  }

  /* ============================================================
     📍 Point GPS — enregistre la position actuelle comme entrée à part entière
     (repère de niveau d'eau, pile de pont, départ de ravine...), avec un nom facultatif.
     Contrairement à la position "au passage" des autres entrées (6 s max, précision non
     notée), on écoute le GPS jusqu'à POINT_GOOD_ACCURACY_M ou POINT_MAX_WAIT_MS, en gardant
     la meilleure mesure, et on enregistre sa précision. L'utilisateur peut valider plus tôt.
     Indépendant du micro : utilisable pendant un enregistrement.
     ============================================================ */
  let pointFix = null;
  function startPoint(){
    if(pointFix) return;
    if(!navigator.geolocation){
      showError(t("pointNoGps"));
      pointFix = { best: null, motif: "non_supportee", startedAt: Date.now(), watchId: null, done: false };
      finishPoint(pointFix, true);
      return;
    }
    const p = pointFix = { best: null, watchId: null, startedAt: Date.now(), timer: null, done: false };
    const btn = addRow.querySelector("#btnPoint");
    btn.disabled = true;
    pointStatus.hidden = false;
    pointStatus.innerHTML = `
      <div class="point-live">
        <div id="pointMsg">${t("pointSearching")}</div>
        <div class="row-actions">
          <button class="btn primary" id="btnPointSave" disabled>✓ ${t("pointSaveNow")}</button>
          <button class="btn" id="btnPointCancel">${t("cancel")}</button>
        </div>
      </div>`;
    pointStatus.querySelector("#btnPointSave").addEventListener("click", () => finishPoint(p, true));
    pointStatus.querySelector("#btnPointCancel").addEventListener("click", () => finishPoint(p, false));
    // Toute mesure compte : celles de cette \u00e9coute d\u00e9di\u00e9e ET celles du suivi continu de l'\u00e9cran
    // (certains navigateurs ne servent pas une 2e \u00e9coute tant que la position ne change pas).
    const consider = (fix) => {
      if(p.done || !fix) return;
      if(!p.best || (fix.accuracy || 9999) < (p.best.accuracy || 9999)){
        p.best = { lat: fix.lat, lng: fix.lng, accuracy: Math.round(fix.accuracy || 0), fixTs: fix.fixTs };
        if(fix.altitude !== null && fix.altitude !== undefined) p.best.altitude = Math.round(fix.altitude);
      }
      const msg = pointStatus.querySelector("#pointMsg");
      if(msg) msg.textContent = t("pointAccuracy") + " \u00b1 " + p.best.accuracy + " m \u2014 " + t("pointImproving");
      const save = pointStatus.querySelector("#btnPointSave");
      if(save) save.disabled = false;
      if(p.best.accuracy <= POINT_GOOD_ACCURACY_M) finishPoint(p, true);
    };
    // Seuls comptent les relev\u00e9s faits APR\u00c8S l'appui (jamais une mesure ant\u00e9rieure ou en cache).
    p.onGeo = () => { if(geoState === "ok" && fixIsFresh(lastFix, p.startedAt)) consider(lastFix); };
    geoListeners.add(p.onGeo);
    p.watchId = navigator.geolocation.watchPosition((pos) => {
      const fix = recordFix(pos);
      if(fixIsFresh(fix, p.startedAt)) consider(fix);
    }, (err) => {
      if(err && err.code === 1){ p.motif = "refusee"; showError(t("pointDenied")); finishPoint(p, true); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: POINT_MAX_WAIT_MS });
    p.timer = setTimeout(() => finishPoint(p, true), POINT_MAX_WAIT_MS);
  }
  async function finishPoint(p, save){
    if(p.done) return;
    p.done = true;
    if(pointFix === p) pointFix = null;
    clearTimeout(p.timer);
    if(p.onGeo) geoListeners.delete(p.onGeo);
    if(p.watchId !== null) navigator.geolocation.clearWatch(p.watchId);
    pointStatus.hidden = true;
    pointStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnPoint");
    if(btn) btn.disabled = false;
    if(!save) return;
    if(!main.isConnected) return;
    // Sans relev\u00e9 frais obtenu apr\u00e8s l'appui : point enregistr\u00e9 SANS position, avec son motif
    // (jamais une position ancienne ou reprise d'une autre entr\u00e9e).
    const motif = p.best ? null : (p.motif || (geoState === "denied" ? "refusee" : "delai_depasse"));
    const choice = await chooseRepere({ title: t("pointNameTitle"), visitUid: visit.uid,
      info: p.best ? t("pointAccuracy").replace("{m}", p.best.accuracy) : t("pointNoFixSaved") });
    if(!choice) return; // annul\u00e9 : on n'enregistre rien
    const entry = { id: uid(), visitUid: visit.uid, kind: "point", text: "", label: choice.label, location: null, timestamp: p.startedAt };
    if(choice.theme) entry.theme = choice.theme;
    if(p.best){ entry.location = p.best; usedFixTs.add(p.best.fixTs); }
    else entry.positionMotif = motif;
    await idbPut("entries", entry);
    refreshEntries(); refreshWeight();
    if(p.best) showToast(t("pointSaved") + " (\u00b1 " + p.best.accuracy + " m)");
    else showError(t("pointNoFix") + " (" + t("motif_" + motif) + ")");
  }

  addRow.querySelector("#btnAddPhoto").addEventListener("click", () => main.querySelector("#photoInput").click());
  main.querySelector("#photoInput").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length && !(await confirmStorageBeforeCapture())){ e.target.value = ""; return; }
    const q = QUALITY_LEVELS[currentQuality()] || QUALITY_LEVELS.std;
    let added = 0, foundExifGps = false;
    for(const file of files){
      try{
        // Lu AVANT compression : le canvas de compression supprime tout EXIF, donc c'est
        // la seule fen\u00eatre o\u00f9 un GPS d\u00e9j\u00e0 pr\u00e9sent dans la photo (prise ailleurs, import\u00e9e
        // depuis un ordinateur) est encore accessible. M\u00eame chemin pour une prise en direct
        // ou un import galerie/disque — aucune distinction faite ici.
        const shotAt = Date.now();
        let exifLocation = null, rawBuf = null;
        try{
          rawBuf = await file.arrayBuffer();
          // GPS inscrit dans la photo : retenu SEULEMENT s'il est dat\u00e9 et contemporain de la prise de vue
          // (sinon c'est souvent la derni\u00e8re position connue du t\u00e9l\u00e9phone, p\u00e9rim\u00e9e \u2014 cas observ\u00e9).
          const ex = extractExifGps(rawBuf);
          const shot = ex && (ex.shotTs || file.lastModified || null);
          if(ex && ex.gpsTs && shot && Math.abs(ex.gpsTs - shot) <= EXIF_GPS_MAX_SKEW_MS){
            exifLocation = { lat: ex.lat, lng: ex.lng, fixTs: new Date(ex.gpsTs).toISOString() };
          }
        }catch(exifErr){ /* pas grave : position GPS en direct ci-dessous */ }

        const blob = await compressPhoto(file, rawBuf, q.maxDim, q.quality);
        rawBuf = null; // lib\u00e9r\u00e9 au plus t\u00f4t
        const data = await blob.arrayBuffer();
        const photoEntry = { id: uid(), visitUid: visit.uid, kind: "photo", data, mime: blob.type || "image/jpeg", label: "", timestamp: shotAt };
        if(exifLocation) photoEntry.location = exifLocation;
        await putEntryWithPosition(photoEntry);
        if(exifLocation) foundExifGps = true;
        added++;
      }catch(err){ showError(err && err.message ? err.message : t("photoUnreadable")); }
    }
    e.target.value = "";
    refreshEntries(); refreshWeight();
    if(foundExifGps) showToast(t("exifGpsFound"));
    else if(added) showToast(t("photosAdded"));
  });

  addRow.querySelector("#btnRec").addEventListener("click", () => toggleRecording());

  addRow.querySelector("#btnImportDoc").addEventListener("click", () => main.querySelector("#docInput").click());
  main.querySelector("#docInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const isTextLike = file.type.startsWith("text/") || /\.txt$/i.test(file.name);
    if(!isTextLike){ showError(t("documentUnsupported")); return; }
    const content = await file.text();
    const suggestedLabel = /ordre.?du.?jour|agenda/i.test(file.name) ? "Ordre du jour" : "";
    await putEntryWithPosition({ id: uid(), visitUid: visit.uid, kind: "texte", text: content, label: suggestedLabel, timestamp: Date.now() });

  addRow.querySelector("#btnImportFile").addEventListener("click", () => main.querySelector("#fileInput").click());
  main.querySelector("#fileInput").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.size > 20 * 1024 * 1024){ showError(t("fileTooBig")); return; }
    const data = await file.arrayBuffer();
    await putEntryWithPosition({
      id: uid(), visitUid: visit.uid, kind: "fichier", data,
      fileName: file.name, mime: file.type || "application/octet-stream",
      label: "", timestamp: Date.now()
    });

    showToast(t("fileImported"));
