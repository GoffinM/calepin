  }).addTo(map);
  map.fitBounds([[PROJECT_BOUNDS.south, PROJECT_BOUNDS.west], [PROJECT_BOUNDS.north, PROJECT_BOUNDS.east]]);

  const prefs = loadMapPrefs();
  let order = prefs.order;
  const hidden = prefs.hidden;
  const leafletLayers = {};
  const defsById = {};
  LAYER_DEFS.forEach(d => { defsById[d.id] = d; });
  defsById[TEAM_LAYER_ID] = { id: TEAM_LAYER_ID, label: t("mapTeamLayer"), color: TEAM_LAYER_COLOR, kind: "point" };

  function applyZOrder(){
    order.forEach(id => {
      const layer = leafletLayers[id];
      if(layer && map.hasLayer(layer) && layer.bringToFront) layer.bringToFront();
    });
  }

  // Couches préparées
  await Promise.all(LAYER_DEFS.map(async (def) => {
    try{
      const data = await loadLayerData(def.id);
      let layer;
      if(def.kind === "point"){
        layer = L.geoJSON(data, {
          pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 7, fillColor: def.color, color: "#fff", weight: 2, fillOpacity: 1 }),
          onEachFeature: (f, l) => l.bindPopup(escapeHtml((f.properties && (f.properties.Name || f.properties.Nme)) || def.label))
        });
      } else if(def.kind === "line"){
        layer = L.geoJSON(data, {
          style: { color: def.color, weight: def.id === "conduite" ? 3.5 : def.id === "riviere" ? 2.5 : 1.2 },
          onEachFeature: (f, l) => {
            const p = f.properties || {};
            if(p.Contour !== undefined && p.Contour !== null) l.bindPopup(escapeHtml(String(p.Contour)) + " m");
            else if(def.id === "conduite") l.bindPopup(escapeHtml(def.label) + (p.Nom ? " \u2014 " + escapeHtml(p.Nom) : "") +
              (p.Longueur_m ? "<br>" + Math.round(p.Longueur_m).toLocaleString("fr-FR") + " m" : ""));
          }
        });
      } else {
        layer = L.geoJSON(data, { style: { color: def.color, weight: 2, fillColor: def.color, fillOpacity: 0.12 } });
      }
      leafletLayers[def.id] = layer;
      if(!hidden.has(def.id)) layer.addTo(map);
    }catch(err){ /* couche indisponible : on continue avec les autres */ }
  }));

  // Couche dynamique : points déjà relevés par l'équipe (base locale)
  const teamLayer = L.layerGroup();
  const visits = (await idbGetAll("visits")).filter(v => !v.trashedAt);
  const visitById = {};
  visits.forEach(v => { visitById[v.uid] = v; });
  const allEntries = await idbGetAll("entries");
  allEntries.filter(e => e.location && visitById[e.visitUid]).forEach(e => {
    const v = visitById[e.visitUid];
    const glyph = entryGlyph(e);
    const snippet = e.text ? escapeHtml(e.text.length > 140 ? e.text.slice(0, 140) + "…" : e.text) : "";
    // Point GPS : marqueur cercl\u00e9 de blanc, plus visible ; autres entr\u00e9es : marqueur simple.
    const marker = L.circleMarker([e.location.lat, e.location.lng], e.kind === "point"
      ? { radius: 8, fillColor: TEAM_LAYER_COLOR, color: "#fff", weight: 3, fillOpacity: 1 }
      : { radius: 6, fillColor: TEAM_LAYER_COLOR, color: "#171A16", weight: 2, fillOpacity: 0.95 });
    marker.bindPopup(`
      <div class="map-popup">
        <strong>${escapeHtml(v.tag) || "\u2014"}</strong><br>
        <span class="pmeta">${glyph} ${fmtDate(v.date)} ${fmtTime(e.timestamp)}${e.label ? " · " + escapeHtml(e.label) : ""}</span>
        ${snippet ? `<div class="psnip">${snippet}</div>` : ""}
        <a href="#visit/${encodeURIComponent(v.uid)}">${t("mapOpenVisit")} ›</a>
      </div>
    `);
    marker.addTo(teamLayer);
  });
  leafletLayers[TEAM_LAYER_ID] = teamLayer;
  if(!hidden.has(TEAM_LAYER_ID)) teamLayer.addTo(map);
  applyZOrder();

  // Panneau de couches (repris de l'outil de vérification) — glisser au doigt ou à la souris
  const panel = wrap.querySelector("#mapPanel");
  const listEl = wrap.querySelector("#layerList");
  wrap.querySelector("#btnLayers").addEventListener("click", () => { panel.hidden = !panel.hidden; if(!panel.hidden) refreshTileInfo(); });
  map.on("click", () => { panel.hidden = true; });

  function renderLayerList(){
    listEl.innerHTML = "";
    const displayOrder = [...order].reverse(); // dessus en premier, plus intuitif à lire
    displayOrder.forEach(id => {
      const def = defsById[id];
      if(!def) return;
      const li = document.createElement("li");
      li.className = "layer-row";
      li.dataset.id = id;
      const available = !!leafletLayers[id];
      const checked = available && map.hasLayer(leafletLayers[id]);
      li.innerHTML = `
        <span class="drag-handle" aria-label="${t("mapDrag")}">⋮⋮</span>
        <label>
          <input type="checkbox" ${checked ? "checked" : ""} ${available ? "" : "disabled"}>
          <span class="swatch" style="background:${def.color}"></span><span>${escapeHtml(def.label)}</span>
        </label>
      `;
      li.querySelector("input").addEventListener("change", (e) => {
        if(e.target.checked){ leafletLayers[id].addTo(map); hidden.delete(id); applyZOrder(); }
        else { map.removeLayer(leafletLayers[id]); hidden.add(id); }
        saveMapPrefs(order, hidden);
      });
      wireDrag(li.querySelector(".drag-handle"), li);
      listEl.appendChild(li);
    });
  }
  /* Réordonnancement par pointeur (fonctionne au doigt, contrairement au drag & drop HTML5
     du prototype, inopérant sur mobile). On déplace la ligne dans la liste pendant le geste,
     puis on reconstruit `order` (dessous -> dessus) au relâchement. */
  function wireDrag(handle, row){
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      row.classList.add("dragging");
      const onMove = (ev) => {
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const over = el && el.closest(".layer-row");
        if(!over || over === row || over.parentNode !== listEl) return;
        const rect = over.getBoundingClientRect();
        const after = ev.clientY > rect.top + rect.height / 2;
        listEl.insertBefore(row, after ? over.nextSibling : over);
      };
      const onUp = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        row.classList.remove("dragging");
        const displayOrder = Array.from(listEl.querySelectorAll(".layer-row")).map(r => r.dataset.id);
        order = displayOrder.reverse();
        saveMapPrefs(order, hidden);
        applyZOrder();
      };
      // Écoute sur window (pas de setPointerCapture) : déplacer la ligne dans le DOM
      // annulerait la capture et on perdrait le relâchement.
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
  }
  renderLayerList();

  // Position GPS en direct
  let meMarker = null, meCircle = null, mapFix = null, watchId = null;
  if(navigator.geolocation){
    watchId = navigator.geolocation.watchPosition((pos) => {
      recordFix(pos); // alimente aussi le statut de position global
      mapFix = [pos.coords.latitude, pos.coords.longitude];
      const acc = pos.coords.accuracy || 0;
      if(!meMarker){
        meCircle = L.circle(mapFix, { radius: acc, color: "#3182ce", weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
        meMarker = L.circleMarker(mapFix, { radius: 7, fillColor: "#3182ce", color: "#fff", weight: 3, fillOpacity: 1 }).addTo(map);
        meMarker.bindPopup(t("mapMe"));
      } else {
        meMarker.setLatLng(mapFix); meCircle.setLatLng(mapFix); meCircle.setRadius(acc);
      }
    }, recordGeoError, { enableHighAccuracy: true, maximumAge: 5000 });
  }
  wrap.querySelector("#btnLocate").addEventListener("click", () => {
    if(mapFix) map.setView(mapFix, Math.max(map.getZoom(), 16));
    else showToast(t("mapNoFix"));
  });
  wrap.querySelector("#btnFit").addEventListener("click", () => {
    map.fitBounds([[PROJECT_BOUNDS.south, PROJECT_BOUNDS.west], [PROJECT_BOUNDS.north, PROJECT_BOUNDS.east]]);
  });

  // Fond de carte hors-ligne : uniquement sur demande explicite
  const tileInfo = wrap.querySelector("#tileInfo");
  const btnTiles = wrap.querySelector("#btnTiles");
  const totalTiles = projectTileUrls().length;
  async function refreshTileInfo(){
    if(tileDownload){ tileInfo.textContent = t("mapDownloading") + " " + tileDownload.done + " / " + tileDownload.total; return; }
    const n = await countCachedTiles();
    const doneAt = Number(localStorage.getItem("rdc39_tiles_done_at") || "0");
    tileInfo.textContent = Math.min(n, totalTiles) + " / " + totalTiles + " " + t("mapTilesCached") +
      (doneAt ? " — " + t("mapTilesDoneAt") + " " + fmtDate(new Date(doneAt).toISOString()) : "");
  }
  btnTiles.addEventListener("click", async () => {
    if(!navigator.onLine){ showToast(t("syncOffline")); return; }
    if(!confirm(t("mapDownloadConfirm").replace("{n}", totalTiles))) return;
    btnTiles.disabled = true;
    const res = await downloadProjectTiles((p) => {
      if(!wrap.isConnected) return;
      tileInfo.textContent = p.finished ? "" : t("mapDownloading") + " " + p.done + " / " + p.total;
    });
    btnTiles.disabled = false;
    if(res && res.failed) showToast(res.failed + " " + t("mapTilesFailed"));
    else showToast(t("mapDownloadDone"));
    if(wrap.isConnected) refreshTileInfo();
  });

  setTimeout(() => map.invalidateSize(), 50);
  currentViewCleanup = () => {
    if(watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    map.remove();
    document.body.classList.remove("map-mode");
  };
}

/* ============================================================
   Routeur : #home | #new | #visit/<uid> | #report/<uid> | #settings | #map
   ============================================================ */
const main = document.getElementById("main");
const pageTitle = document.getElementById("pageTitle");
const btnBack = document.getElementById("btnBack");
const btnSettings = document.getElementById("btnSettings");
const btnFolders = document.getElementById("btnFolders");
const btnMap = document.getElementById("btnMap");
const fabNew = document.getElementById("fabNew");

window.addEventListener("hashchange", route);
btnBack.addEventListener("click", () => { window.location.hash = "#home"; });
btnSettings.addEventListener("click", () => { window.location.hash = "#settings"; });
btnFolders.addEventListener("click", () => { window.location.hash = "#folders"; });
btnMap.addEventListener("click", () => { window.location.hash = "#map"; });
document.getElementById("geoBadge").addEventListener("click", () => showGeoSheet(false));
fabNew.addEventListener("click", () => { window.location.hash = "#new"; });

function route(){
  if(!appUnlocked) return;
  document.documentElement.style.setProperty("--appbar-h", document.getElementById("appbar").offsetHeight + "px");
  if(currentViewCleanup){ try{ currentViewCleanup(); }catch(e){} currentViewCleanup = null; }
  const hash = window.location.hash || "#home";
  pageTitle.textContent = t("appName");
  refreshSyncBadge();
  if(hash === "#home"){
    btnBack.hidden = true; fabNew.hidden = false;
    renderHome();
  } else if(hash === "#new"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("newVisit");
    renderNewVisit();
  } else if(hash === "#settings"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("settings");
    renderSettings();
  } else if(hash === "#map"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("map");
    renderMap();
  } else if(hash === "#folders"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("folders");
    renderFolders();
  } else if(hash === "#trash"){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("trash");
    renderTrash();
  } else if(hash.startsWith("#report/")){
    btnBack.hidden = false; fabNew.hidden = true; pageTitle.textContent = t("reportTitle");
    renderReport(hash.slice(8));
  } else if(hash.startsWith("#visit/")){
    btnBack.hidden = false; fabNew.hidden = true;
    renderVisitDetail(hash.slice(7));
  } else {
    window.location.hash = "#home";
  }
}

/* ============================================================
   Vue : accueil
   ============================================================ */
let filterState = { search: "", period: "", folder: null };
let selectMode = false;
let selectedIds = new Set();

async function renderHome(){
  main.innerHTML = "";
  fabNew.hidden = selectMode;

  const toolbar = document.createElement("div");
  toolbar.className = "home-toolbar";
  if(!selectMode){
    toolbar.innerHTML = `<button id="btnEnterSelect">${t("selectMode")}</button>`;
  }
  main.appendChild(toolbar);

  let selectBar = null;
  if(selectMode){
    selectBar = document.createElement("div");
    selectBar.className = "select-bar";
    main.appendChild(selectBar);
  }

  if(filterState.folder){
    const label = filterState.folder === "unfiled" ? t("unfiled") : await folderPathLabel(filterState.folder);
    const activeFolder = document.createElement("div");
    activeFolder.className = "active-folder";
    activeFolder.innerHTML = `<span>\u{1F4C1} ${escapeHtml(label)}</span><button id="btnClearFolder">${t("activeFolderClear")}</button>`;
    main.appendChild(activeFolder);
    activeFolder.querySelector("#btnClearFolder").addEventListener("click", () => { filterState.folder = null; route(); });
  }

  const filters = document.createElement("div");
  filters.className = "filters";
  filters.innerHTML = `
    <select id="fPeriod">
      <option value="">${t("filterAllPeriod")}</option>
      <option value="7">${t("period7")}</option>
      <option value="30">${t("period30")}</option>
    </select>
    <input type="search" id="fSearch" placeholder="${t("search")}">
  `;
  main.appendChild(filters);
  const listEl = document.createElement("div");
  listEl.className = "visit-list";
  main.appendChild(listEl);

  if(!selectMode){
    toolbar.querySelector("#btnEnterSelect").addEventListener("click", () => {
      selectMode = true; selectedIds = new Set(); route();
    });
  }

  function renderSelectBar(){
    if(!selectBar) return;
    selectBar.innerHTML = `
      <span class="count">${selectedIds.size} ${t("selectedCount")}</span>
      <div class="actions">
        <button class="btn" id="btnMoveSelected" ${selectedIds.size === 0 ? "disabled" : ""}>${t("moveSelected")}</button>
        <button class="btn danger" id="btnDeleteSelected" ${selectedIds.size === 0 ? "disabled" : ""}>${t("deleteSelected")}</button>
        <button class="btn" id="btnCancelSelect">${t("selectCancel")}</button>
      </div>
    `;
    selectBar.querySelector("#btnCancelSelect").addEventListener("click", () => {
      selectMode = false; selectedIds = new Set(); route();
    });
    selectBar.querySelector("#btnMoveSelected").addEventListener("click", async () => {
      if(selectedIds.size === 0) return;
      await showFolderPicker(async (folderId) => {
        const ids = Array.from(selectedIds);
        for(const uid2 of ids){
          const v = await idbGet("visits", uid2);
          if(v){ v.folderId = folderId; await idbPut("visits", v); }
        }
        showToast(ids.length + " " + t("movedSelectedCount"));
        selectMode = false; selectedIds = new Set();
        route();
      });
    });
    selectBar.querySelector("#btnDeleteSelected").addEventListener("click", async () => {
      if(selectedIds.size === 0) return;
      if(!confirm(t("confirmDeleteSelected"))) return;
      const ids = Array.from(selectedIds);
      for(const uid2 of ids){
        const v = await idbGet("visits", uid2);
        if(v){ v.trashedAt = Date.now(); await idbPut("visits", v); }
      }
      showToast(ids.length + " " + t("trashedSelectedCount"));
      selectMode = false; selectedIds = new Set();
      route();
    });
  }
  renderSelectBar();

  filters.querySelector("#fPeriod").value = filterState.period;
  filters.querySelector("#fSearch").value = filterState.search;
  filters.querySelector("#fPeriod").addEventListener("change", e => { filterState.period = e.target.value; refreshList(); });
  filters.querySelector("#fSearch").addEventListener("input", e => { filterState.search = e.target.value; refreshList(); });

  async function refreshList(){
    let visits = await idbGetAll("visits");
    visits = visits.filter(v => !v.trashedAt);
    visits.sort((a,b) => new Date(b.date) - new Date(a.date));
    if(filterState.folder === "unfiled") visits = visits.filter(v => !v.folderId);
    else if(filterState.folder) visits = visits.filter(v => v.folderId === filterState.folder);
    if(filterState.period){
      const cutoff = Date.now() - Number(filterState.period) * 86400000;
      visits = visits.filter(v => new Date(v.date).getTime() >= cutoff);
    }
    let entriesByVisit = {};
    if(filterState.search){
      const q = filterState.search.toLowerCase();
      const kept = [];
      for(const v of visits){
        const entries = await idbGetByIndex("entries", "visitUid", v.uid);
        entriesByVisit[v.uid] = entries;
        const hay = [v.tag, ...(v.tags || []), ...entries.map(e => e.text || ""), ...entries.map(e => e.label || "")].join(" ").toLowerCase();
        if(hay.includes(q)) kept.push(v);
      }
      visits = kept;
    }

    if(visits.length === 0){
      listEl.innerHTML = `<div class="empty-state"><div class="glyph">\u{1F4D3}</div><p><strong>${t("emptyTitle")}</strong></p><p>${t("emptyBody")}</p></div>`;
      return;
    }
    listEl.innerHTML = "";
    for(const v of visits){
      const entries = entriesByVisit[v.uid] || await idbGetByIndex("entries", "visitUid", v.uid);
      const nAudio = entries.filter(e => e.kind === "audio").length;
      const nPoint = entries.filter(e => e.kind === "point").length;
      const nPhoto = entries.filter(e => e.kind === "photo").length;
      const nText = entries.filter(e => e.kind === "texte").length;
      const isSelected = selectedIds.has(v.uid);
      const card = document.createElement("button");
      card.className = "visit-card" + (isSelected ? " selected" : "");
      card.innerHTML = `
        ${selectMode ? `<div class="check">${isSelected ? "\u2713" : ""}</div>` : `<div class="glyph">${VISIT_GLYPH}</div>`}
        <div class="info">
          <div class="tag">${escapeHtml(v.tag) || "\u2014"}</div>
          <div class="meta">${fmtDate(v.date)}${visitIsSent(v, entries) ? " \u00b7 \u2713" : " \u00b7 \u23F3"}</div>
        </div>
        <div class="counts">
          ${nAudio ? `<span>\u{1F3A4} ${nAudio}</span>` : ""}
          ${nPoint ? `<span>\u{1F4CD} ${nPoint}</span>` : ""}
          ${nPhoto ? `<span>\u{1F4F7} ${nPhoto}</span>` : ""}
          ${nText ? `<span>\u{1F4DD} ${nText}</span>` : ""}
        </div>
      `;
      if(selectMode){
        card.addEventListener("click", () => {
          if(selectedIds.has(v.uid)) selectedIds.delete(v.uid); else selectedIds.add(v.uid);
          renderSelectBar();
          card.classList.toggle("selected");
          card.querySelector(".check").textContent = selectedIds.has(v.uid) ? "\u2713" : "";
        });
      } else {
        card.addEventListener("click", () => { window.location.hash = "#visit/" + v.uid; });
      }
      listEl.appendChild(card);
    }
  }
  refreshList();
}

/* ============================================================
   Vue : nouvelle visite (plus de GPS unique ici)
   ============================================================ */
function renderNewVisit(){
  main.innerHTML = "";
  const now = new Date();
  const dateVal = now.toISOString().slice(0,10);

  const form = document.createElement("div");
  form.innerHTML = `
    <div class="field"><label for="fTag">${t("landmark")}</label>
      <input type="text" id="fTag" list="tagOptions" placeholder="${t("landmarkPh")}" autocomplete="off">
      <datalist id="tagOptions"></datalist>
    </div>
    <div class="field"><label for="fDate">${t("date")}</label><input type="date" id="fDate" value="${dateVal}"></div>
    <div class="form-actions"><button class="btn primary" id="btnCreate" style="width:100%">${t("createVisit")}</button></div>
  `;
  main.appendChild(form);

  idbGetAll("visits").then(visits => {
    const tags = Array.from(new Set(visits.map(v => (v.tag || "").trim()).filter(Boolean)));
    tags.sort((a,b) => a.localeCompare(b));
    form.querySelector("#tagOptions").innerHTML = tags.map(tg => `<option value="${escapeHtml(tg)}"></option>`).join("");
  });

  form.querySelector("#btnCreate").addEventListener("click", async () => {
    const tag = form.querySelector("#fTag").value.trim();
    const dateStr = form.querySelector("#fDate").value || dateVal;
    const visit = {
      uid: uid(), tag,
      date: new Date(dateStr + "T" + now.toTimeString().slice(0,8)).toISOString(),
      folderId: null, tags: [], trashedAt: null,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    await idbPut("visits", visit);
    showToast(t("visitCreated"));
    window.location.hash = "#visit/" + visit.uid;
  });
}

/* ============================================================
   Vue : d\u00e9tail d'une visite — entr\u00e9es unifi\u00e9es (audio/photo/texte)
   ============================================================ */
let recordStart = null, recordTimerInterval = null;
const WEIGHT_WARN = 30 * 1024 * 1024, WEIGHT_DANGER = 80 * 1024 * 1024;

async function renderVisitDetail(uidVal){
  const visit = await idbGet("visits", uidVal);
  if(!visit){ window.location.hash = "#home"; return; }
  main.innerHTML = "";
  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML = `
    <h2>${escapeHtml(visit.tag) || "\u2014"}</h2>
    <div class="meta">${fmtDateTime(visit.date)}</div>
  `;
  main.appendChild(head);

  const classementSection = document.createElement("div");
  classementSection.className = "section";
  classementSection.innerHTML = `
    <h3>${t("classement")}</h3>
    <div class="simple-list-row" id="rowFolder" style="cursor:pointer;">
      <span>\u{1F4C1} <span id="folderLabelText">\u2026</span></span>
      <span style="color: var(--accent); font-size:12px;">${t("changeFolder")}</span>
    </div>
    <div class="tag-chip-list" id="tagChips"></div>
    <button class="btn" id="btnAddTag" style="font-size:12px; padding:6px 10px;">${t("addTag")}</button>
  `;
  main.appendChild(classementSection);

  async function refreshFolderLabel(){
    classementSection.querySelector("#folderLabelText").textContent = await folderPathLabel(visit.folderId);
  }
  refreshFolderLabel();
  classementSection.querySelector("#rowFolder").addEventListener("click", () => {
    showFolderPicker(async (folderId) => {
      visit.folderId = folderId;
      await idbPut("visits", visit);
      refreshFolderLabel();
    });
  });

  function refreshTagChips(){
    const chips = classementSection.querySelector("#tagChips");
    chips.innerHTML = (visit.tags || []).map(tag => `
      <span class="tag-chip">${escapeHtml(tag)}<button data-tag="${escapeHtml(tag)}">\u2715</button></span>
    `).join("");
    chips.querySelectorAll("button[data-tag]").forEach(btn => {
      btn.addEventListener("click", async () => {
        visit.tags = (visit.tags || []).filter(tg => tg !== btn.dataset.tag);
        await idbPut("visits", visit);
        refreshTagChips();
      });
    });
  }
  refreshTagChips();
  classementSection.querySelector("#btnAddTag").addEventListener("click", async () => {
    const name = prompt(t("addTagPrompt"));
    if(name && name.trim()){
      visit.tags = Array.from(new Set([...(visit.tags || []), name.trim()]));
      await idbPut("visits", visit);
      refreshTagChips();
    }
  });

  const weightBanner = document.createElement("div");
  weightBanner.className = "weight-banner";
  weightBanner.id = "weightBanner";
  main.appendChild(weightBanner);

  const addRow = document.createElement("div");
  addRow.className = "add-row";
  addRow.innerHTML = `
    <button class="btn rec-main" id="btnRec" title="${t("addAudio")}">\u{1F3A4} ${t("addAudio")}</button>

  /* Position d'une nouvelle entr\u00e9e sans faire attendre l'utilisateur : derni\u00e8re mesure si
     r\u00e9cente ; sinon l'entr\u00e9e est enregistr\u00e9e tout de suite et la position lui est rattach\u00e9e
     d\u00e8s qu'elle arrive (si personne ne l'a renseign\u00e9e \u00e0 la main entre-temps). */
  const LATE_FIX_WINDOW_MS = 2 * 60 * 1000; // au-del\u00e0, on aurait pu bouger : on n'attache plus
  const RETRY_PAUSE_MS = 3000;
  /* L'entr\u00e9e est d\u00e9j\u00e0 sauvegard\u00e9e ; on lui rattache la position d\u00e8s qu'elle arrive :
     tentatives r\u00e9p\u00e9t\u00e9es pendant GEO_TIMEOUT_MS (~20 s), puis \u00e9coute du suivi continu jusqu'\u00e0
     LATE_FIX_WINDOW_MS. Si rien n'arrive dans les ~20 s, le motif est enregistr\u00e9 (positionMotif) ;
     il sera retir\u00e9 automatiquement si une position arrive ensuite dans la fen\u00eatre. */
  function attachPositionLater(entryId){
    const startedAt = Date.now();
    const deadline = startedAt + GEO_TIMEOUT_MS;
    let done = false;
    const stop = () => { done = true; geoListeners.delete(onGeo); };
    const attach = async (loc) => {
      if(done || !loc || Date.now() - startedAt > LATE_FIX_WINDOW_MS) return;
      stop();
      const e = await idbGet("entries", entryId);
      if(!e || e.location) return;
      e.location = loc;
      await idbPut("entries", e);
      if(main.isConnected && entryList.isConnected) refreshEntries();
    };
    const recordMotif = async (motif) => {
      const e = await idbGet("entries", entryId);
      if(!e || e.location || e.positionMotif === motif) return;
      e.positionMotif = POSITION_MOTIFS.includes(motif) ? motif : "indisponible";
      await idbPut("entries", e);
      if(main.isConnected && entryList.isConnected) refreshEntries();
    };
    const onGeo = () => {
      if(Date.now() - startedAt > LATE_FIX_WINDOW_MS){ geoListeners.delete(onGeo); return; }
      if(geoState === "ok") attach(freshFix());
    };
    geoListeners.add(onGeo);
    const attempt = async () => {
      if(done) return;
      const r = await getPositionResult(Math.max(3000, deadline - Date.now()));
      if(r.loc){ attach(r.loc); return; }
      if(done) return;
      if(r.motif === "refusee" || r.motif === "non_supportee" || Date.now() + RETRY_PAUSE_MS >= deadline){
        await recordMotif(r.motif);
        if(r.motif === "non_supportee") stop(); // inutile d'\u00e9couter : il n'y aura jamais de position
        return;
      }
      setTimeout(attempt, RETRY_PAUSE_MS);
    };
    attempt();
  }
  async function putEntryWithPosition(entry){
    if(entry.location === undefined) entry.location = freshFix();
    await idbPut("entries", entry);
    if(!entry.location) attachPositionLater(entry.id);
    return entry;
  }

      });
      card.querySelectorAll('[data-act="position"]').forEach(btn => btn.addEventListener("click", async () => {
        // Sans position : on propose directement la position actuelle (si une mesure r\u00e9cente existe).
        const nowFix = entry.location ? null : freshFix();
        const current = entry.location ? entry.location.lat + ", " + entry.location.lng
          : nowFix ? nowFix.lat.toFixed(6) + ", " + nowFix.lng.toFixed(6) : "";
        const val = prompt(t("editPositionPrompt") + (nowFix ? "\n" + t("editPositionCurrentHint") + " (\u00b1 " + nowFix.accuracy + " m)" : ""), current);

        if(trimmed === ""){

          await migrateEntryIfLegacy(entry); await idbPut("entries", entry);
          showToast(t("editPositionCleared"));
          refreshEntries();
          return;
        }
        const parts = trimmed.split(",").map(s => s.trim());
        const lat = parts.length === 2 ? Number(parts[0]) : NaN;
        const lng = parts.length === 2 ? Number(parts[1]) : NaN;
        if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180){
          showToast(t("editPositionInvalid"));
          return;
        }
        entry.location = (nowFix && val.trim() === current) ? nowFix : { lat, lng };
        await migrateEntryIfLegacy(entry); await idbPut("entries", entry);
        showToast(t("editPositionSaved"));
        refreshEntries();
      }));
      entryList.appendChild(card);
    }

  /* ============================================================
     📍 Point GPS — enregistre la position actuelle comme entrée à part entière
     (repère de niveau d'eau, pile de pont, départ de ravine...), avec un nom facultatif.
     Contrairement à la position "au passage" des autres entrées (6 s max, précision non
     notée), on écoute le GPS jusqu'à POINT_GOOD_ACCURACY_M ou POINT_MAX_WAIT_MS, en gardant
     la meilleure mesure, et on enregistre sa précision. L'utilisateur peut valider plus tôt.
     Indépendant du micro : utilisable pendant un enregistrement.
     ============================================================ */
  let pointFix = null;
  function startPoint(){
    if(pointFix) return;
    if(!navigator.geolocation){ showToast(t("pointNoGps")); return; }
    const p = pointFix = { best: null, watchId: null, startedAt: Date.now(), timer: null, done: false };
    const btn = addRow.querySelector("#btnPoint");
    btn.disabled = true;
    pointStatus.hidden = false;
    pointStatus.innerHTML = `
      <div class="point-live">
        <div id="pointMsg">${t("pointSearching")}</div>
        <div class="row-actions">
          <button class="btn primary" id="btnPointSave" disabled>✓ ${t("pointSaveNow")}</button>
          <button class="btn" id="btnPointCancel">${t("cancel")}</button>
        </div>
      </div>`;
    pointStatus.querySelector("#btnPointSave").addEventListener("click", () => finishPoint(p, true));
    pointStatus.querySelector("#btnPointCancel").addEventListener("click", () => finishPoint(p, false));
    // Toute mesure compte : celles de cette \u00e9coute d\u00e9di\u00e9e ET celles du suivi continu de l'\u00e9cran
    // (certains navigateurs ne servent pas une 2e \u00e9coute tant que la position ne change pas).
    const consider = (fix) => {
      if(p.done || !fix) return;
      if(!p.best || (fix.accuracy || 9999) < (p.best.accuracy || 9999)){
        p.best = { lat: fix.lat, lng: fix.lng, accuracy: Math.round(fix.accuracy || 0) };
        if(fix.altitude !== null && fix.altitude !== undefined) p.best.altitude = Math.round(fix.altitude);
      }
      const msg = pointStatus.querySelector("#pointMsg");
      if(msg) msg.textContent = t("pointAccuracy") + " \u00b1 " + p.best.accuracy + " m \u2014 " + t("pointImproving");
      const save = pointStatus.querySelector("#btnPointSave");
      if(save) save.disabled = false;
      if(p.best.accuracy <= POINT_GOOD_ACCURACY_M) finishPoint(p, true);
    };
    p.onGeo = () => { if(geoState === "ok" && lastFix && lastFix.at >= p.startedAt - POINT_SEED_MAX_AGE_MS) consider(lastFix); };
    geoListeners.add(p.onGeo);
    p.onGeo(); // mesure de moins de quelques secondes : point de d\u00e9part
    p.watchId = navigator.geolocation.watchPosition((pos) => {
      consider(recordFix(pos));
    }, (err) => {
      if(err && err.code === 1){ showToast(t("pointDenied")); finishPoint(p, false); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: POINT_MAX_WAIT_MS });
    p.timer = setTimeout(() => finishPoint(p, true), POINT_MAX_WAIT_MS);
  }
  async function finishPoint(p, save){
    if(p.done) return;
    p.done = true;
    if(pointFix === p) pointFix = null;
    clearTimeout(p.timer);
    if(p.onGeo) geoListeners.delete(p.onGeo);
    if(p.watchId !== null) navigator.geolocation.clearWatch(p.watchId);
    pointStatus.hidden = true;
    pointStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnPoint");
    if(btn) btn.disabled = false;
    if(!save) return;
    if(!p.best){ showToast(t("pointNoFix")); return; }
    if(!main.isConnected) return;
    const name = prompt(t("pointNamePrompt") + " (± " + p.best.accuracy + " m)", "");
    if(name === null) return; // annulé : on n'enregistre rien
    await idbPut("entries", { id: uid(), visitUid: visit.uid, kind: "point", text: "", label: name.trim(), location: p.best, timestamp: Date.now() });
    refreshEntries(); refreshWeight();
    showToast(t("pointSaved") + " (± " + p.best.accuracy + " m)");
  }
  addRow.querySelector("#btnPoint").addEventListener("click", startPoint);

  /* ============================================================
     🎤 Enregistrer — capture principale, fonctionne SANS réseau.
     - MediaRecorder.start(timeslice) : un morceau toutes les REC_TIMESLICE_MS, écrit
       aussitôt dans IndexedDB (ArrayBuffer, jamais Blob — bug WebKit). Si l'app est tuée
       (batterie, appel, iOS), les morceaux déjà écrits sont récupérés au lancement suivant.
     - Niveau sonore en direct (AnalyserNode sur le même flux), durée + taille sauvegardée,
       alerte à l'arrêt si rien n'a été capté, écran maintenu allumé (Wake Lock),
       avertissement si l'utilisateur a quitté l'app pendant la capture.
     - Jamais en même temps que Dicter (conflit micro).
     ============================================================ */
  let rec = null;
  async function toggleRecording(){
    if(rec){ stopRecording(); return; }
    if(dict) return;
    const btn = addRow.querySelector("#btnRec");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ showToast(t("micUnavailable")); return; }
    // AudioContext créé dans le geste utilisateur, avant tout await (exigence iOS).
    const Ctx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    try{ audioCtx = Ctx ? new Ctx() : null; }catch(e){ audioCtx = null; }
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(err){ if(audioCtx) audioCtx.close().catch(() => {}); showToast(t("micDenied")); return; }
    const mime = bestAudioMime();
    let mr;
    try{ mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: REC_BITRATE }, mime ? { mimeType: mime } : {})); }
    catch(e){ mr = new MediaRecorder(stream); }
    const recId = uid();
    const meta = { recId, visitUid: visit.uid, mime: mr.mimeType || mime || "audio/webm", startedAt: Date.now(), location: freshFix() };
    await idbPutRaw("recordings", meta);
    if(!meta.location) tryGetPosition().then(loc => { if(loc && !meta.location){ meta.location = loc; idbPutRaw("recordings", meta).catch(() => {}); } });

    const r = rec = { mr, stream, recId, seq: 0, bytes: 0, startedAt: Date.now(), audioCtx, peak: 0, writes: [], wakeLock: null, leftApp: false, stopping: false };
    activeRecIds.add(recId);
    mr.ondataavailable = (e) => {
      if(!e.data || e.data.size === 0) return;
      const seq = r.seq++;
      const size = e.data.size;
      r.writes.push(e.data.arrayBuffer()
        .then(buf => idbPutRaw("audioChunks", { id: recId + ":" + String(seq).padStart(6, "0"), recId, seq, data: buf }))
        .then(() => { r.bytes += size; })
        .catch(() => {}));
    };
    mr.onstop = () => finishRecording(r);
    mr.onerror = () => { try{ if(mr.state !== "inactive") mr.stop(); else finishRecording(r); }catch(e){ finishRecording(r); } };
    mr.start(REC_TIMESLICE_MS);

    // Niveau sonore
    if(audioCtx){
      try{
        const src = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser); // pas de connexion vers les haut-parleurs : aucune lecture
        if(audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        const buf = new Uint8Array(analyser.fftSize);
        r.levelTimer = setInterval(() => {
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for(let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
          const rms = Math.sqrt(sum / buf.length);
          if(rms > r.peak) r.peak = rms;
          const bar = document.getElementById("levelBar");
          // \u00e9chelle racine : une voix normale remplit visiblement la barre, le silence la laisse vide
          if(bar) bar.style.width = Math.min(100, Math.round(Math.sqrt(rms) * 160)) + "%";
        }, 100);
      }catch(e){ r.peak = -1; } // pas de mesure possible : on ne déclenchera pas l'alerte "silence"
    } else r.peak = -1;

    // Écran maintenu allumé
    requestWakeLock(r);

    btn.textContent = "⏹ " + t("recStop");
    btn.classList.add("recording");
    addRow.querySelector("#btnDictate").disabled = true;
    recStatus.innerHTML = `
      <div class="rec-live">
        <div class="rec-line"><span class="rec-dot">●</span><span class="rec-timer" id="recTimer">00:00</span></div>
        <div class="level"><div class="level-bar" id="levelBar"></div></div>
        <div class="rec-keep">${t("recKeepOpen")}</div>
      </div>`;
    recordTimerInterval = setInterval(() => {
      const el = document.getElementById("recTimer");
      if(el) el.textContent = fmtDuration((Date.now() - r.startedAt) / 1000) + " · " + fmtBytes(r.bytes) + " " + t("recSavedBytes");
    }, 250);
  }
  function stopRecording(){
    const r = rec;
    if(!r || r.stopping) return;
    r.stopping = true;
    try{ if(r.mr.state !== "inactive") r.mr.stop(); else finishRecording(r); }catch(e){ finishRecording(r); }
  }
  async function finishRecording(r){
    if(r.finished) return;
    r.finished = true;
    if(rec === r) rec = null;
    const durationSec = Math.round((Date.now() - r.startedAt) / 1000);
    clearInterval(recordTimerInterval);
    clearInterval(r.levelTimer);
    r.stream.getTracks().forEach(tr => tr.stop());
    if(r.audioCtx) r.audioCtx.close().catch(() => {});
    if(r.wakeLock) r.wakeLock.release().catch(() => {});
    recStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnRec");
    btn.textContent = "\u{1F3A4} " + t("addAudio");
    btn.classList.remove("recording");
    updateDictateAvailability();
    await Promise.all(r.writes);
    const entry = await finalizeRecording(r.recId, durationSec, false);
    if(entry && !entry.location) attachPositionLater(entry.id);
    activeRecIds.delete(r.recId);
    if(!main.isConnected) return;
    refreshEntries(); refreshWeight();
    if(!entry){ showToast(t("recEmpty")); return; }
    showToast(t("recSaved") + " (" + fmtDuration(durationSec) + ")");
    if(r.peak >= 0 && r.peak < REC_SILENCE_THRESHOLD) alert(t("recSilentWarning"));
    else if(r.leftApp) alert(t("recBackgroundWarn"));
  }
  function requestWakeLock(r){
    if(!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(l => { r.wakeLock = l; }).catch(() => {});
  }
  function onVisibility(){
    const r = rec;
    if(!r) return;
    if(document.visibilityState === "hidden") r.leftApp = true;
    else {
      requestWakeLock(r);
      // iOS peut avoir coupé le micro en arrière-plan : si l'enregistreur s'est arrêté seul, on sauvegarde.
      if(r.mr.state === "inactive") finishRecording(r);
      else showToast(t("recBackgroundToast"));
    }
  }
  function onBeforeUnload(e){ if(rec || dict){ e.preventDefault(); e.returnValue = ""; } }
  document.addEventListener("visibilitychange", onVisibility);
  window.addEventListener("beforeunload", onBeforeUnload);

  /* ============================================================
     🗣️ Dicter — secondaire, exige le réseau (bloqué hors connexion).
     Correctif des doublons/troncatures observés en mode continu : une session de
     reconnaissance PAR ÉNONCÉ (continuous = false), relancée automatiquement tant que
     l'utilisateur n'a pas touché Arrêter ; un seul résultat final par session, ajouté
     (jamais écrasé) avec anti-doublon ; brouillon sauvegardé au fil de l'eau ; texte
     marqué source:"dictee" (non relu). Affichage en direct : validé en noir, provisoire en gris.
     ============================================================ */
  let dict = null;
  const DICT_MAX_MS = 10 * 60 * 1000;
  function speechCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }
  function updateDictateAvailability(){
    const btn = addRow.querySelector("#btnDictate");
    const offHint = main.querySelector("#dictOffline");
    if(!btn) return;
    const offline = !navigator.onLine;
    btn.disabled = !!rec || (!dict && (offline || !speechCtor()));
    if(offHint){
      offHint.hidden = !(offline || !speechCtor()) || !!dict;
      offHint.textContent = speechCtor() ? t("dictateOfflineHint") : t("transcribeUnsupported");
    }
  }
  function onNetChange(){
    updateDictateAvailability();
    if(dict && !navigator.onLine){ dict.netLost = true; dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){} }
  }
  window.addEventListener("online", onNetChange);
  window.addEventListener("offline", onNetChange);

  function normalizeSpeech(s){ return (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim(); }
  function commitDictation(d, text){
    text = (text || "").trim();
    const n = normalizeSpeech(text);
    if(!n) return;
    const c = normalizeSpeech(d.committed);
    if(c === n || c.endsWith(" " + n)) return; // anti-doublon : déjà validé
    d.committed = d.committed ? d.committed + " " + text : text;
    if(!d.entry){
      d.entry = { id: uid(), visitUid: visit.uid, kind: "texte", source: "dictee", text: d.committed, label: "", location: d.location || null, timestamp: d.startedAt };
      d.needsLatePosition = !d.entry.location;
    } else {
      d.entry.text = d.committed;
      if(!d.entry.location && d.location) d.entry.location = d.location;
    }
    const snapshot = d.entry;
    d.saving = d.saving.then(() => idbPut("entries", snapshot)).catch(() => {});
    // Brouillon cr\u00e9\u00e9 sans position : on la lui rattachera d\u00e8s qu'elle arrive (apr\u00e8s sa 1re sauvegarde).
    if(d.needsLatePosition){
      d.needsLatePosition = false;
      const id = snapshot.id;
      d.saving = d.saving.then(() => attachPositionLater(id));
    }
  }
  function renderDictation(d){
    const f = document.getElementById("dictFinal");
    const i = document.getElementById("dictInterim");
    if(f) f.textContent = d.committed;
    if(i) i.textContent = d.interim ? (d.committed ? " " : "") + d.interim : "";
  }
  function toggleDictation(){
    if(dict){ dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){ finishDictation(dict); } return; }
    if(rec) return;
    if(!speechCtor()){ showToast(t("transcribeUnsupported")); return; }
    if(!navigator.onLine){ showToast(t("dictateOfflineBlocked")); return; }
    const d = dict = { committed: "", interim: "", stopRequested: false, entry: null, errorShown: false, rec: null,
      startedAt: Date.now(), location: null, saving: Promise.resolve(), errCount: 0 };
    // Position : mesure r\u00e9cente si elle existe ; sinon elle est demand\u00e9e d\u00e8s maintenant et, si elle
    // arrive avant le premier texte, le brouillon est cr\u00e9\u00e9 AVEC elle ; si elle arrive apr\u00e8s, elle est
    // rattach\u00e9e au brouillon (attachPositionLater), et idbPut la conserve \u00e0 chaque sauvegarde suivante.
    d.location = freshFix();
    if(!d.location) getPositionResult().then(r => { if(r.loc && !d.location) d.location = r.loc; });
    const btn = addRow.querySelector("#btnDictate");
    btn.textContent = t("dictateStop");
    addRow.querySelector("#btnRec").disabled = true;
    updateDictateAvailability();
    recStatus.innerHTML = `
      <div class="dict-live">
        <div class="rec-line"><span class="rec-dot">●</span><span class="rec-timer" id="recTimer">${t("dictateListening")}</span></div>
        <div class="dict-text"><span class="final" id="dictFinal"></span><span class="interim" id="dictInterim"></span></div>
      </div>`;
    recordTimerInterval = setInterval(() => {
      const el = document.getElementById("recTimer");
      if(el) el.textContent = t("dictateListening") + " " + fmtDuration((Date.now() - d.startedAt) / 1000);
      if(Date.now() - d.startedAt > DICT_MAX_MS){ d.stopRequested = true; try{ d.rec && d.rec.stop(); }catch(e){} }
    }, 250);
    startDictationSession(d);
  }
  function startDictationSession(d){
    const r = new (speechCtor())();
    d.rec = r;
    r.lang = speechRecogLangTag();
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;
    let sessionFinal = "", sessionInterim = "";
    r.onresult = (e) => {
      let fin = "", inter = "";
      for(let i = 0; i < e.results.length; i++){
        const tr = e.results[i][0].transcript;
        if(e.results[i].isFinal) fin = tr; // un seul final par session : le dernier fait foi
        else inter += tr;
      }
      if(fin) sessionFinal = fin;
      sessionInterim = inter;
      d.interim = (sessionFinal ? sessionFinal + " " : "") + inter;
      renderDictation(d);
    };
    r.onerror = (e) => {
      if(e.error === "aborted" && d.stopRequested) return;
      if(e.error === "no-speech" || e.error === "aborted") return; // silence : la session suivante prend le relais
      if(e.error === "network"){ d.netLost = true; d.stopRequested = true; }
      else if(e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture"){ d.stopRequested = true; }
      else if(++d.errCount > 3) d.stopRequested = true;
      if(d.stopRequested && !d.errorShown && !d.netLost){
        d.errorShown = true;
        showToast(t("dictationErrorPrefix") + " : " + dictationErrorLabel(e.error));
      }
    };
    r.onend = () => {
      // Si le moteur s'arrête sans résultat final, on garde le provisoire plutôt que de le perdre.
      commitDictation(d, sessionFinal || sessionInterim);
      d.interim = "";
      renderDictation(d);
      if(!d.stopRequested && dict === d && navigator.onLine){
        setTimeout(() => {
          if(d.stopRequested || dict !== d){ finishDictation(d); return; }
          try{ startDictationSession(d); }catch(err){ finishDictation(d); }
        }, 120);
      } else {
        finishDictation(d);
      }
    };
    try{ r.start(); }
    catch(err){ d.stopRequested = true; finishDictation(d); }
  }
  async function finishDictation(d){
    if(d.finished) return;
    d.finished = true;
    if(dict === d) dict = null;
    clearInterval(recordTimerInterval);
    recStatus.innerHTML = "";
    const btn = addRow.querySelector("#btnDictate");
    btn.textContent = t("addDictate");
    addRow.querySelector("#btnRec").disabled = false;
    updateDictateAvailability();
    await d.saving;
    if(!main.isConnected) return;
    refreshEntries(); refreshWeight();
    if(d.netLost) showToast(d.entry ? t("dictateNetLost") : t("dictateNetLostEmpty"));
    else if(d.entry) showToast(t("dictateSaved"));
    else if(!d.errorShown) showToast(t("dictateEmpty"));
  }

  function dictationErrorLabel(code){
    if(code === "not-allowed" || code === "service-not-allowed") return t("dictationErrorNoAllow");
    if(code === "network") return t("dictationErrorNetwork");
    if(code === "no-speech") return t("dictationErrorNoSpeech");
    return t("dictationErrorOther") + " (" + code + ")";
  }

  // Quitter l'écran arrête proprement une capture en cours (elle est sauvegardée) et retire les écouteurs.
  currentViewCleanup = () => {
    stopGeoWatch();
    geoListeners.delete(renderGeoLine);
    if(pointFix) finishPoint(pointFix, false);
    if(rec) stopRecording();
    if(dict){ dict.stopRequested = true; try{ dict.rec && dict.rec.stop(); }catch(e){} }
    document.removeEventListener("visibilitychange", onVisibility);
    window.removeEventListener("beforeunload", onBeforeUnload);
    window.removeEventListener("online", onNetChange);
    window.removeEventListener("offline", onNetChange);
  };
  updateDictateAvailability();

  async function exportVisit(v){
    const entries = await idbGetByIndex("entries", "visitUid", v.uid);
    entries.sort((a,b) => a.timestamp - b.timestamp);
    const totalBytes = entries.reduce((s,e) => s + getEntrySize(e), 0);
    if(!confirm(t("exportVisit") + " (~" + fmtBytes(totalBytes) + " " + t("exportWeightEstimate") + ")")) return;
    const reportText = buildReportText(v, entries, "chrono");
    downloadBlob(new Blob([reportText], { type: "text/plain;charset=utf-8" }), safeFileName(v.tag || v.uid) + "_rapport.txt");
    const manifest = {
      uid: v.uid, tag: v.tag, date: v.date,
      entries: entries.map((e,i) => ({
        type: e.kind, horodatage: new Date(e.timestamp).toISOString(), repere: e.label || null,
        position: e.location || null, texte: e.text || null,
        fichier: getEntrySize(e) > 0 ? (e.kind === "fichier" ? (e.fileName || ("fichier_" + (i+1))) : (e.kind === "audio" ? "audio_" : "photo_") + (i+1) + extFor(e)) : null
      }))
    };
    downloadBlob(new Blob([JSON.stringify(manifest, null, 2)], { type: "application/json" }), safeFileName(v.tag || v.uid) + "_donnees.json");
    entries.forEach((e, i) => {
      let entryBlob = getEntryBlob(e);
      if(!entryBlob) return;
      if(e.kind === "photo" && e.data && e.location){
        entryBlob = new Blob([photoBufferForExport(e.data, e, getEntryMime(e))], { type: getEntryMime(e) || "image/jpeg" });
      }
      const name = e.kind === "fichier" ? (e.fileName || ("fichier_" + (i+1))) : safeFileName(v.tag || v.uid) + "_" + (e.kind === "audio" ? "audio_" : "photo_") + (i+1) + extFor(e);
      downloadBlob(entryBlob, name);
    });
    showToast(t("exportLaunched"));
  }

  /* Export "digest" : un seul fichier JSON autonome, pens\u00e9 pour \u00eatre lu par un programme
     plut\u00f4t qu'un humain (cf. note de connexion Calepin -> module pompage). Photos ET pi\u00e8ces
     jointes (PDF/DOCX/XLSX) encod\u00e9es en base64 et int\u00e9gr\u00e9es (pour les pi\u00e8ces jointes, aucun
     substitut texte n'existe, contrairement \u00e0 l'audio — le fichier brut est donc la seule
     trace possible de cette information) ; audio volontairement EXCLU (transcription seule) ;
     aucune synth\u00e8se IA n'est g\u00e9n\u00e9r\u00e9e \u00e0 la demande de l'export. */
  async function exportDigest(v){
    const entriesForWeight = await idbGetByIndex("entries", "visitUid", v.uid);
    const nonCompressible = entriesForWeight.filter(e => e.kind === "fichier").length;
    const estBytes = entriesForWeight.reduce((s,e) => s + getEntrySize(e) * 1.33, 0);
    let confirmMsg = t("digestConfirm") + " (~" + fmtBytes(estBytes) + " " + t("exportWeightEstimate") + ")";
    if(nonCompressible > 0) confirmMsg += " \u2014 " + t("exportWeightWarn");
    if(!confirm(confirmMsg)) return;
    const digest = await buildDigest(v);
    downloadBlob(new Blob([JSON.stringify(digest)], { type: "application/json" }), safeFileName(v.tag || v.uid) + "_digest.json");
    showToast(t("digestExported"));
  }
  function extFor(e){
    if(e.kind === "photo") return ".jpg";
    const type = getEntryMime(e) || "";
    if(type.includes("mp4")) return ".m4a";
    if(type.includes("ogg")) return ".ogg";
    return ".webm";
  }
  function safeFileName(s){
    return (s || "visite").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0, 40);
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function deleteVisit(v){
    if(!confirm(t("confirmDeleteVisit"))) return;
    v.trashedAt = Date.now();
    await idbPut("visits", v);
    showToast(t("trashedVisit"));
    window.location.hash = "#home";
  }

  refreshWeight();
  refreshEntries();
}

/* ============================================================
   Assemblage d\u00e9terministe du rapport (texte, pas de mise en page)
   ============================================================ */
function buildReportText(visit, entries, groupBy){
  let out = (visit.tag || "\u2014") + "\n" + fmtDate(visit.date) + "\n" + "=".repeat(40) + "\n\n";
  const lineFor = (e) => {
    const time = fmtTime(e.timestamp);
    const gps = e.location ? " [" + e.location.lat.toFixed(5) + ", " + e.location.lng.toFixed(5) + "]" : "";
    if(e.kind === "photo") return "- " + time + gps + " \u2014 [photo]" + (e.text ? " " + e.text : "");
    if(e.kind === "point") return "- " + time + " \u2014 [point GPS " + fmtPointDetails(e.location) + "]" + (e.label ? " " + e.label : "") + (e.text && e.text.trim() ? " \u2014 " + e.text.trim() : "");
    if(e.kind === "audio") return "- " + time + gps + " \u2014 [audio " + fmtDuration(e.duration) + "]" + (e.text && e.text.trim() ? " " + e.text.trim() : "");
    if(e.kind === "fichier") return "- " + time + gps + " \u2014 [fichier " + (e.fileName || "") + "]";
    const content = e.text && e.text.trim() ? e.text.trim() : "(" + t("transcriptPh") + ")";
    return "- " + time + gps + " \u2014 " + content;
  };
  if(groupBy === "landmark"){
    const groups = {};
    for(const e of entries){
      const key = e.label && e.label.trim() ? e.label.trim() : t("noLandmark");
      (groups[key] = groups[key] || []).push(e);
    }
    for(const key of Object.keys(groups)){
      out += key + "\n" + "-".repeat(key.length) + "\n";
      for(const e of groups[key]) out += lineFor(e) + "\n";
      out += "\n";
    }
  } else {
    for(const e of entries) out += lineFor(e) + "\n";
  }
  return out;
}

/* ============================================================
   Vue : rapport / consolidation (consultation en app)
   ============================================================ */
async function renderReport(uidVal){
  const visit = await idbGet("visits", uidVal);
  if(!visit){ window.location.hash = "#home"; return; }
  let groupBy = "chrono";

  main.innerHTML = "";
  const head = document.createElement("div");
  head.className = "detail-head";
  head.innerHTML = `<h2>${escapeHtml(visit.tag) || "\u2014"}</h2><div class="meta">${fmtDate(visit.date)}</div>`;
  main.appendChild(head);

  const toggle = document.createElement("div");
  toggle.className = "group-toggle";
  toggle.innerHTML = `<button data-g="chrono" class="active">${t("groupChrono")}</button><button data-g="landmark">${t("groupLandmark")}</button>`;
  main.appendChild(toggle);

  const body = document.createElement("div");
  main.appendChild(body);

  const exportBtn = document.createElement("button");
  exportBtn.className = "btn"; exportBtn.style.width = "100%"; exportBtn.style.marginTop = "18px";
  exportBtn.textContent = "\u{1F4E4} " + t("exportReport");
  main.appendChild(exportBtn);

  async function render(){
    const entries = (await idbGetByIndex("entries", "visitUid", visit.uid)).sort((a,b) => a.timestamp - b.timestamp);
    body.innerHTML = "";
    if(entries.length === 0){
      body.innerHTML = `<p class="capture-hint">${t("noEntries")}</p>`;
      return;
    }
    const renderEntry = (e) => {
      const div = document.createElement("div");
      div.className = "report-entry";
      const gps = e.location && e.kind !== "point" ? " \u00b7 \u{1F4CD} " + e.location.lat.toFixed(5) + ", " + e.location.lng.toFixed(5) : "";
      let inner = `<span class="rmeta">${fmtTime(e.timestamp)}${gps}</span>`;
      if(e.kind === "photo"){
        const entryBlob = getEntryBlob(e);
        const url = entryBlob ? URL.createObjectURL(entryBlob) : "";
        inner += `<img src="${url}" alt="">`;
      } else if(e.kind === "point"){
        inner += `<div>\u{1F4CD} ${escapeHtml((e.label ? e.label + " \u2014 " : "") + fmtPointDetails(e.location))}</div>` +
          (e.text && e.text.trim() ? `<div>${escapeHtml(e.text.trim())}</div>` : "");
      } else if(e.kind === "audio"){
        const entryBlob = getEntryBlob(e);
        const url = entryBlob ? URL.createObjectURL(entryBlob) : "";
        inner += `<audio controls preload="metadata" src="${url}" style="width:100%; height:32px;"></audio>` +
          (e.text && e.text.trim() ? `<div>${escapeHtml(e.text.trim())}</div>` : "");
      } else {
        inner += escapeHtml(e.text && e.text.trim() ? e.text.trim() : "(" + t("transcriptPh") + ")");
      }
      div.innerHTML = inner;
      return div;
    };
    if(groupBy === "landmark"){
      const groups = {};
      for(const e of entries){
        const key = e.label && e.label.trim() ? e.label.trim() : t("noLandmark");
        (groups[key] = groups[key] || []).push(e);
      }
      for(const key of Object.keys(groups)){
        const g = document.createElement("div");
        g.className = "report-group";
        const h = document.createElement("h3"); h.textContent = key; g.appendChild(h);
        for(const e of groups[key]) g.appendChild(renderEntry(e));
        body.appendChild(g);
      }
    } else {
      const g = document.createElement("div");
      g.className = "report-group";
      for(const e of entries) g.appendChild(renderEntry(e));
      body.appendChild(g);
    }
  }

  toggle.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      groupBy = btn.dataset.g;
      toggle.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  exportBtn.addEventListener("click", async () => {
    const entries = (await idbGetByIndex("entries", "visitUid", visit.uid)).sort((a,b) => a.timestamp - b.timestamp);
    const txt = buildReportText(visit, entries, groupBy);
    const url = URL.createObjectURL(new Blob([txt], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = (visit.tag || "rapport").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0,40) + "_rapport.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast(t("reportExported"));
  });

  render();
}

   Vue : r\u00e9glages (langue, qualit\u00e9 photo, stockage)

/* ============================================================
   Vue : Dossiers (arborescence 2 niveaux) + gestion des tags
   ============================================================ */
async function renderFolders(){
  main.innerHTML = "";

  const introHint = document.createElement("p");
  introHint.className = "capture-hint";
  introHint.style.marginTop = "0";
  introHint.textContent = t("hintFolders");
  main.appendChild(introHint);

  const shortcuts = document.createElement("div");
  shortcuts.className = "folder-top";
  shortcuts.innerHTML = `
    <div class="simple-list-row" id="rowAll"><span>${t("allVisits")}</span><span>\u203a</span></div>
    <div class="simple-list-row" id="rowUnfiled"><span>${t("unfiled")}</span><span>\u203a</span></div>
    <div class="simple-list-row" id="rowTrash"><span>\u{1F5D1} ${t("trash")}</span><span>\u203a</span></div>
  `;
  main.appendChild(shortcuts);
  shortcuts.querySelector("#rowAll").addEventListener("click", () => { filterState.folder = null; window.location.hash = "#home"; });
  shortcuts.querySelector("#rowUnfiled").addEventListener("click", () => { filterState.folder = "unfiled"; window.location.hash = "#home"; });
  shortcuts.querySelector("#rowTrash").addEventListener("click", () => { window.location.hash = "#trash"; });

  const folderSection = document.createElement("div");
  folderSection.className = "section";
  folderSection.innerHTML = `<h3>${t("folders")}</h3><div id="folderTree"></div><button class="btn" id="btnNewTop">${t("newTopFolder")}</button>`;
  main.appendChild(folderSection);

  async function renderTree(){
    const tree = folderSection.querySelector("#folderTree");
    tree.innerHTML = "";
    const allVisitsForCount = (await idbGetAll("visits")).filter(v => !v.trashedAt);
    function countFor(folderId){ return allVisitsForCount.filter(v => v.folderId === folderId).length; }
    const tops = await getTopFolders();
    for(const top of tops){
      const row = document.createElement("div");
      row.className = "folder-top-row";
      row.style.cursor = "pointer";
      row.innerHTML = `
        <span class="name">${escapeHtml(top.name)}<span class="count">(${countFor(top.id)})</span></span>
        <div class="folder-actions">
          <button data-act="rename">\u270f\ufe0f</button>
          <button data-act="delete">\u{1F5D1}</button>
        </div>
      `;
      row.addEventListener("click", () => { filterState.folder = top.id; window.location.hash = "#home"; });
      row.querySelector('[data-act="rename"]').addEventListener("click", async (e) => {
        e.stopPropagation();
        const name = prompt(t("renameFolderPrompt"), top.name);
        if(name && name.trim()){ top.name = name.trim(); await idbPut("folders", top); renderTree(); }
      });
      row.querySelector('[data-act="delete"]').addEventListener("click", async (e) => {
        e.stopPropagation();
        if(!confirm(t("confirmDeleteFolder"))) return;
        const subs = await getSubFolders(top.id);
        const allVisits = await idbGetAll("visits");
        for(const sub of subs){
          for(const v of allVisits.filter(v2 => v2.folderId === sub.id)){ v.folderId = null; await idbPut("visits", v); }
          await idbDelete("folders", sub.id);
        }
        for(const v of allVisits.filter(v2 => v2.folderId === top.id)){ v.folderId = null; await idbPut("visits", v); }
        await idbDelete("folders", top.id);
        renderTree();
      });
      tree.appendChild(row);

      const subList = document.createElement("div");
      subList.className = "folder-sub-list";
      const subs = await getSubFolders(top.id);
      for(const sub of subs){
        const subRow = document.createElement("div");
        subRow.className = "folder-sub-row";
        subRow.style.cursor = "pointer";
        subRow.innerHTML = `
          <span>${escapeHtml(sub.name)}<span class="count">(${countFor(sub.id)})</span></span>
          <div class="folder-actions">
            <button data-act="move">\u21c6</button>
            <button data-act="rename">\u270f\ufe0f</button>
            <button data-act="delete">\u{1F5D1}</button>
          </div>
        `;
        subRow.addEventListener("click", () => { filterState.folder = sub.id; window.location.hash = "#home"; });
        subRow.querySelector('[data-act="rename"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          const name = prompt(t("renameFolderPrompt"), sub.name);
          if(name && name.trim()){ sub.name = name.trim(); await idbPut("folders", sub); renderTree(); }
        });
        subRow.querySelector('[data-act="delete"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          if(!confirm(t("confirmDeleteFolder"))) return;
          const allVisits = await idbGetAll("visits");
          for(const v of allVisits.filter(v2 => v2.folderId === sub.id)){ v.folderId = null; await idbPut("visits", v); }
          await idbDelete("folders", sub.id);
          renderTree();
        });
        subRow.querySelector('[data-act="move"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          const others = (await getTopFolders()).filter(f => f.id !== top.id);
          if(others.length === 0){ showToast(t("moveFolderPrompt")); return; }
          const label = others.map((f,i) => (i+1) + ". " + f.name).join("\n");
          const choice = prompt(t("moveFolderPrompt") + "\n" + label);
          const idx = Number(choice) - 1;
          if(others[idx]){ sub.parentId = others[idx].id; await idbPut("folders", sub); renderTree(); }
        });
        subList.appendChild(subRow);
      }
      tree.appendChild(subList);

      const addSub = document.createElement("div");
      addSub.className = "folder-add-sub";
      addSub.innerHTML = `<button>${t("newSubFolder")}</button>`;
      addSub.querySelector("button").addEventListener("click", async () => {
        const name = prompt(t("newSubFolderPrompt"));
        if(name && name.trim()){
          await idbPut("folders", { id: uid(), name: name.trim(), parentId: top.id });
          renderTree();
        }
      });
      tree.appendChild(addSub);
    }
  }
  renderTree();

  folderSection.querySelector("#btnNewTop").addEventListener("click", async () => {
    const name = prompt(t("newTopFolderPrompt"));
    if(name && name.trim()){
      await idbPut("folders", { id: uid(), name: name.trim(), parentId: null });
      renderTree();
    }
  });

  const tagSection = document.createElement("div");
  tagSection.className = "section";
  tagSection.innerHTML = `<h3>${t("tagsSection")}</h3><div id="tagList"></div>`;
  main.appendChild(tagSection);

  async function renderTagList(){
    const list = tagSection.querySelector("#tagList");
    const tags = await allTagsWithCounts();
    if(tags.length === 0){ list.innerHTML = `<p class="capture-hint">${t("noTags")}</p>`; return; }
    list.innerHTML = "";
    for(const { tag, count } of tags){
      const row = document.createElement("div");
      row.className = "simple-list-row";
      row.innerHTML = `
        <span>${escapeHtml(tag)} <span class="storage-line" style="display:inline;">(${count})</span></span>
        <div class="folder-actions">
          <button data-act="rename">\u270f\ufe0f</button>
          <button data-act="delete">\u{1F5D1}</button>
        </div>
      `;
      row.querySelector('[data-act="rename"]').addEventListener("click", async () => {
        const newName = prompt(t("renameTagPrompt"), tag);
        if(!newName || !newName.trim() || newName.trim() === tag) return;
        const visits = await idbGetAll("visits");
        for(const v of visits){
          if((v.tags || []).includes(tag)){
            v.tags = Array.from(new Set(v.tags.map(tg => tg === tag ? newName.trim() : tg)));
            await idbPut("visits", v);
          }
        }
        renderTagList();
      });
      row.querySelector('[data-act="delete"]').addEventListener("click", async () => {
        if(!confirm(t("confirmDeleteTag"))) return;
        const visits = await idbGetAll("visits");
        for(const v of visits){
          if((v.tags || []).includes(tag)){
            v.tags = v.tags.filter(tg => tg !== tag);
            await idbPut("visits", v);
          }
        }
        renderTagList();
      });
      list.appendChild(row);
    }
  }
  renderTagList();
}

/* ============================================================
   Vue : Corbeille
   ============================================================ */
async function renderTrash(){
  main.innerHTML = "";
  const emptyBtn = document.createElement("button");
  emptyBtn.className = "btn danger"; emptyBtn.style.width = "100%"; emptyBtn.style.marginBottom = "16px";
  emptyBtn.textContent = "\u{1F5D1} " + t("emptyTrash");
  main.appendChild(emptyBtn);

  const listEl = document.createElement("div");
  main.appendChild(listEl);

  async function refresh(){
    const visits = (await idbGetAll("visits")).filter(v => v.trashedAt).sort((a,b) => b.trashedAt - a.trashedAt);
    if(visits.length === 0){
      listEl.innerHTML = `<p class="capture-hint">${t("emptyTrashState")}</p>`;
      emptyBtn.hidden = true;
      return;
    }
    emptyBtn.hidden = false;
    listEl.innerHTML = "";
    for(const v of visits){
      const row = document.createElement("div");
      row.className = "visit-card";
      row.style.cursor = "default";
      row.innerHTML = `
        <div class="glyph">${VISIT_GLYPH}</div>
        <div class="info">
          <div class="tag">${escapeHtml(v.tag) || "\u2014"}</div>
          <div class="meta">${fmtDate(v.date)}</div>
        </div>
        <div class="folder-actions">
          <button data-act="restore">${t("restoreVisit")}</button>
          <button data-act="forever">\u{1F5D1}</button>
        </div>
      `;
      row.querySelector('[data-act="restore"]').addEventListener("click", async () => {
        v.trashedAt = null;
        await idbPut("visits", v);
        showToast(t("restoredVisit"));
        refresh();
      });
      row.querySelector('[data-act="forever"]').addEventListener("click", async () => {
        if(!confirm(t("confirmDeleteForever"))) return;
        const entries = await idbGetByIndex("entries", "visitUid", v.uid);
        for(const e of entries) await idbDelete("entries", e.id);
        await idbDelete("visits", v.uid);
        refresh();
      });
      listEl.appendChild(row);
    }
  }
  emptyBtn.addEventListener("click", async () => {
    if(!confirm(t("confirmEmptyTrash"))) return;
    const visits = (await idbGetAll("visits")).filter(v => v.trashedAt);
    for(const v of visits){
      const entries = await idbGetByIndex("entries", "visitUid", v.uid);
      for(const e of entries) await idbDelete("entries", e.id);
      await idbDelete("visits", v.uid);
    }
    refresh();
  });
  refresh();
}

async function renderSettings(){
  main.innerHTML = "";

  const langGroup = document.createElement("div");
  langGroup.className = "settings-group";
  langGroup.innerHTML = `<h3>${t("settingsLang")}</h3><div class="lang-grid" id="langGrid"></div>`;
  main.appendChild(langGroup);
  const langs = [["fr","Fran\u00e7ais"],["en","English"],["sw","Kiswahili"]];
  function renderLangGrid(){
    const grid = langGroup.querySelector("#langGrid");
    grid.innerHTML = langs.map(([id,label]) => `<button class="opt-btn ${currentLang()===id?"selected":""}" data-lang="${id}">${label}</button>`).join("");
    grid.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => { setLang(btn.dataset.lang); route(); });
    });
  }
  renderLangGrid();

  const qualGroup = document.createElement("div");
  qualGroup.className = "settings-group";
  qualGroup.innerHTML = `<h3>${t("settingsQuality")}</h3><div class="quality-grid" id="qualGrid"></div>`;
  main.appendChild(qualGroup);
  const qualities = [["eco", t("qualityEco"), t("qualityEcoSub")], ["std", t("qualityStd"), t("qualityStdSub")], ["hi", t("qualityHi"), t("qualityHiSub")]];
  function renderQualGrid(){
    const grid = qualGroup.querySelector("#qualGrid");
    grid.innerHTML = qualities.map(([id,label,sub]) => `
      <button class="opt-btn ${currentQuality()===id?"selected":""}" data-q="${id}">
        <span>${label}</span><span class="sub">${sub}</span>
      </button>`).join("");
    grid.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => { setQuality(btn.dataset.q); renderQualGrid(); });
    });
  }
  renderQualGrid();

  /* Synchronisation : \u00e9tat seulement (l'envoi est automatique d\u00e8s qu'une connexion existe),
     plus un bouton de repli silencieux pour forcer une tentative imm\u00e9diate. */
  const syncGroup = document.createElement("div");
  syncGroup.className = "settings-group";
  syncGroup.innerHTML = `
    <h3>${t("settingsSync")}</h3>
    <div class="storage-line" id="syncLine">\u2026</div>
    <div class="storage-line" id="syncLastLine" style="margin-top:4px;"></div>
    <button class="btn" id="btnSyncNow" style="width:100%; margin-top:10px;">${t("syncNow")}</button>
    <p class="capture-hint" style="margin-top:8px;">${t("settingsSyncSub")}</p>
  `;
  main.appendChild(syncGroup);
  async function renderSyncLine(){
    const st = await syncStatus();
    syncGroup.querySelector("#syncLine").textContent = st.pending === 0
      ? t("syncAllSent") + " (" + st.total + ")"
      : st.pending + " " + t("syncPendingCount") + (navigator.onLine ? "" : " \u2014 " + t("syncOffline"));
    const last = Number(localStorage.getItem("rdc39_last_sync") || "0");
    syncGroup.querySelector("#syncLastLine").textContent = last ? t("syncLast") + " : " + fmtDateTime(new Date(last).toISOString()) : "";
  }
  renderSyncLine();
  syncGroup.querySelector("#btnSyncNow").addEventListener("click", async () => {
    const btn = syncGroup.querySelector("#btnSyncNow");
    btn.disabled = true;
    const res = await syncPending({ verbose: true });
    btn.disabled = false;
    renderSyncLine();
    if(res && res.error) showToast(t("syncError") + " : " + res.error);
    else showToast(t("syncDone"));
  });

  const accessGroup = document.createElement("div");
  accessGroup.className = "settings-group";
  const lastOk = Number(localStorage.getItem("rdc39_access_validated_at") || "0");
  accessGroup.innerHTML = `
    <h3>${t("settingsAccess")}</h3>
    <div class="storage-line">${t("accessLastCheck")} : ${lastOk ? fmtDateTime(new Date(lastOk).toISOString()) : "\u2014"}</div>
    <div class="storage-line" style="margin-top:4px;">${t("accessDevice")} : ${escapeHtml(deviceId().slice(0, 8))}</div>
    ${RELAY_URL ? "" : `<div class="storage-line" style="margin-top:4px; word-break:break-all;">${t("accessRelay")} : ${escapeHtml(currentRelayUrl() || "\u2014")}</div>`}
  `;
  main.appendChild(accessGroup);

  const storageGroup = document.createElement("div");
  storageGroup.className = "settings-group";
  storageGroup.innerHTML = `<h3>${t("settingsStorage")}</h3><div class="storage-line" id="storageLine">\u2026</div><div class="storage-line" id="versionLine" style="margin-top:6px;">RDC39-Calepin v${APP_VERSION}</div>`;
  main.appendChild(storageGroup);
  if(navigator.storage && navigator.storage.estimate){
    try{
      const est = await navigator.storage.estimate();
      storageGroup.querySelector("#storageLine").textContent = fmtBytes(est.usage || 0) + " " + t("storageUsed");
    }catch(e){
      storageGroup.querySelector("#storageLine").textContent = t("storageUnknown");
    }
  } else {
    storageGroup.querySelector("#storageLine").textContent = t("storageUnknown");
  }

  const feedbackGroup = document.createElement("div");
  feedbackGroup.className = "settings-group";
  feedbackGroup.innerHTML = `<button class="btn" id="btnFeedback" style="width:100%;">${t("feedbackSend")}</button>`;
  main.appendChild(feedbackGroup);
  feedbackGroup.querySelector("#btnFeedback").addEventListener("click", sendFeedback);
}

/* ============================================================
   Retour bêta-test : même logique que le digest (jamais d'envoi
   automatique, geste volontaire) — utilise le partage natif du
   téléphone plutôt qu'un service d'envoi centralisé.
   ============================================================ */
async function sendFeedback(){
  const msg = prompt(t("feedbackPrompt"));
  if(!msg || !msg.trim()) return;

  const visits = await idbGetAll("visits");
  let storageInfo = "n/a";
  if(navigator.storage && navigator.storage.estimate){
    try{ const est = await navigator.storage.estimate(); storageInfo = fmtBytes(est.usage || 0); }catch(e){}
  }
  const payload = {
    message: msg.trim(),
    horodatage: new Date().toISOString(),
    langue: currentLang(),
    nombreVisites: visits.length,
    stockageUtilise: storageInfo,
    versionApp: APP_VERSION,
    navigateur: (navigator.userAgent || "").slice(0, 200)
  };
  const readableText = payload.message + "\n\n---\n" + payload.horodatage + " \u00b7 " +
    payload.nombreVisites + " visites \u00b7 " + payload.stockageUtilise + "\nRDC39-Calepin v" + payload.versionApp + "\n" + payload.navigateur;
  const jsonBlob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const fileName = "rdc39_retour_" + Date.now() + ".json";

  if(navigator.share){
    try{
      const file = new File([jsonBlob], fileName, { type: "application/json" });
      const shareData = (navigator.canShare && navigator.canShare({ files: [file] }))
        ? { title: t("feedbackShareTitle"), text: readableText, files: [file] }
        : { title: t("feedbackShareTitle"), text: readableText };
      await navigator.share(shareData);
      showToast(t("feedbackSent"));
      return;
    }catch(err){
      // annul\u00e9 par l'utilisateur ou API indisponible pour ce contenu \u2014 on retombe sur le t\u00e9l\u00e9chargement
    }
  }
  const url = URL.createObjectURL(jsonBlob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast(t("feedbackNoShare"));
}

   Service worker + d\u00e9marrage

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

// Rien ne s'affiche avant le passage de la porte d'acc\u00e8s (code valid\u00e9 ou d\u00e9lai de gr\u00e2ce).
startAccessGate();
})();
