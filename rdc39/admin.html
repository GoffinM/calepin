<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RDC39 — Relevés reçus</title>
<style>
  :root{ --bg:#14170F; --surface:#1D2116; --raised:#262B1D; --text:#EDE8DC; --dim:#A6A896; --accent:#C9A227; --ink:#171A16; --line:#33392A; --danger:#E6A18C; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  main{ max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--dim); font-size:13px; margin:0 0 20px; line-height:1.5; }
  input{ background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15px; width:100%; max-width:320px; }
  button{ background:var(--raised); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.primary{ background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:600; }
  button:disabled{ opacity:.5; cursor:default; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg{ color:var(--dim); font-size:13px; margin:10px 0; }
  .msg.err{ color:var(--danger); }
  .visit{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .visit .t{ font-weight:600; }
  .visit .m{ color:var(--dim); font-size:12px; font-family:"SF Mono",Consolas,Menlo,monospace; margin:3px 0 10px; }
  .tag{ display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:6px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Relevés reçus</h1>
  <p class="sub">Page d'administration RDC39 (non liée depuis l'app). Code admin = variable <code>ADMIN_CODE</code> du relais. Rien n'est conservé dans ce navigateur après fermeture de l'onglet.</p>
  <div class="row" id="login">
    <input type="password" id="code" placeholder="Code admin" autocomplete="off">
    <button class="primary" id="go">Afficher</button>
  </div>
  <p class="msg" id="msg"></p>
  <div id="list"></div>
</main>
<script>
(function(){
"use strict";
const RELAY_URL = "https://terrain-relais.michel-goffin.workers.dev";
const $ = (id) => document.getElementById(id);
let adminCode = sessionStorage.getItem("rdc39_admin_code") || "";

function msg(text, isErr){ $("msg").textContent = text || ""; $("msg").className = "msg" + (isErr ? " err" : ""); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function safeName(s){ return (s || "visite").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9-_]+/g, "_").slice(0, 40); }
async function call(path, body){
  const resp = await fetch(RELAY_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Code": adminCode },
    body: JSON.stringify(body || {})
  });
  if(resp.status === 403) throw new Error("Code admin refusé (ou ADMIN_CODE non configuré sur le relais).");
  if(!resp.ok) throw new Error("HTTP " + resp.status + " " + (await resp.text()).slice(0, 160));
  return resp.json();
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function b64ToBlob(b64, mime){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime || "application/octet-stream" });
}
function extFor(mime, fallback){
  mime = mime || "";
  if(mime.includes("mp4") || mime.includes("aac")) return ".m4a";
  if(mime.includes("webm")) return ".webm";
  if(mime.includes("ogg")) return ".ogg";
  if(mime.includes("jpeg") || mime.includes("jpg")) return ".jpg";
  if(mime.includes("png")) return ".png";
  return fallback || "";
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function load(){
  msg("Chargement…");
  try{
    const data = await call("/admin/list");
    sessionStorage.setItem("rdc39_admin_code", adminCode);
    const visits = (data.visits || []).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    msg(visits.length + " visite(s). La liste KV peut avoir jusqu'à une minute de retard sur les derniers envois.");
    $("list").innerHTML = "";
    for(const v of visits){
      const div = document.createElement("div");
      div.className = "visit";
      div.innerHTML = `
        <div class="t">${esc(v.repere || "—")}${v.corbeille ? '<span class="tag">corbeille</span>' : ""}</div>
        <div class="m">${esc((v.date || "").slice(0, 10))} · ${esc(v.entrees)} entrée(s)${v.dossier ? " · " + esc(v.dossier) : ""} · appareil ${esc(String(v.appareil || "").slice(0, 8))} · reçu ${esc((v.recuLe || "").replace("T", " ").slice(0, 16))}</div>
        <div class="row">
          <button data-act="json">Digest JSON</button>
          <button data-act="files">Fichiers (audio, photos…)</button>
        </div>`;
      div.querySelector('[data-act="json"]').addEventListener("click", (e) => getVisit(v, e.target, false));
      div.querySelector('[data-act="files"]').addEventListener("click", (e) => getVisit(v, e.target, true));
      $("list").appendChild(div);
    }
  }catch(err){
    msg(err.message, true);
  }
}
async function getVisit(v, btn, asFiles){
  btn.disabled = true;
  try{
    const d = await call("/admin/visit", { uid: v.uid });
    const base = safeName((d.date || "").slice(0, 10) + "_" + (d.tag || d.uid));
    if(d.entreesManquantes && d.entreesManquantes.length) msg(d.entreesManquantes.length + " entrée(s) pas encore reçue(s) pour cette visite (envoi en cours ou interrompu).", true);
    if(!asFiles){
      download(new Blob([JSON.stringify(d, null, 1)], { type: "application/json" }), base + "_digest.json");
    } else {
      let n = 0;
      for(const [i, e] of (d.entries || []).entries()){
        const num = String(i + 1).padStart(2, "0");
        const time = (e.horodatage || "").slice(11, 16).replace(":", "h");
        if(e.audio && e.audio.base64){ download(b64ToBlob(e.audio.base64, e.audio.mime), base + "_" + num + "_audio_" + time + extFor(e.audio.mime, ".webm")); n++; }
        else if(e.image && e.image.base64){ download(b64ToBlob(e.image.base64, e.image.mime), base + "_" + num + "_photo_" + time + extFor(e.image.mime, ".jpg")); n++; }
        else if(e.fichier && e.fichier.base64){ download(b64ToBlob(e.fichier.base64, e.fichier.mime), base + "_" + num + "_" + safeName(e.fichier.nom || "fichier")); n++; }
        else continue;
        await sleep(400); // les navigateurs bloquent les rafales de téléchargements
      }
      if(!n) msg("Aucun fichier dans cette visite (notes texte uniquement : voir le digest JSON).");
    }
  }catch(err){
    msg(err.message, true);
  }finally{
    btn.disabled = false;
  }
}

$("go").addEventListener("click", () => { adminCode = $("code").value.trim(); if(adminCode) load(); });
$("code").addEventListener("keydown", (e) => { if(e.key === "Enter") $("go").click(); });
if(adminCode){ $("code").value = adminCode; load(); }
})();
</script>
</body>
</html>
